<!DOCTYPE html>
<html lang="zh-CN" data-page="plaza">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bot 广场 · 挑一个能干活的 AI 同事</title>
<style>
:root{
  --bg:#ffffff; --panel:#f7f7f8; --soft:#eef0f2; --soft-2:#e4e7ea;
  --line:#eff1f4; --line-2:#e2e5e9;
  --ink:#15171a; --ink-2:#3f444b; --muted:#8a8f99; --muted-2:#a9aeb7;
  --brand:#ef4b36; --brand-2:#ff7a5c; --brand-soft:#fff3f0;
  --ok:#129a5a; --warn:#b7791f; --danger:#d64545;
  --shadow-1:0 1px 2px rgba(16,24,40,.05);
  --shadow-2:0 18px 44px rgba(16,24,40,.14);
  --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:13px;height:13px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#dcdfe4;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#cdd1d7;background-clip:content-box}

/* ---------------- 顶栏 ---------------- */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.86);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(150deg,#ff8a63,#ef3d2b 62%,#e0361f);display:grid;place-items:center;
  box-shadow:0 4px 12px rgba(239,61,43,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.brand-text{min-width:0}
.brand-name{font-size:14px;font-weight:650;letter-spacing:.1px;white-space:nowrap}
.brand-sub{font-size:10.5px;color:var(--muted-2);white-space:nowrap}
.search{flex:1;max-width:460px;display:flex;align-items:center;gap:7px;height:36px;
  padding:0 12px;border:1px solid var(--line-2);border-radius:11px;background:#fff;
  color:var(--muted);box-shadow:var(--shadow-1)}
.search:focus-within{border-color:#f3b9ac;box-shadow:0 0 0 3px rgba(239,75,54,.08)}
.search input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:13px}
.search kbd{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted-2);
  border:1px solid var(--line-2);border-radius:5px;padding:2px 5px;background:var(--panel)}
.top-links{display:flex;align-items:center;gap:6px;margin-left:auto}
.link-btn{height:32px;padding:0 10px;border:1px solid var(--line-2);border-radius:9px;
  background:#fff;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;
  box-shadow:var(--shadow-1);color:var(--ink-2);white-space:nowrap}
.link-btn:hover{border-color:#d4d8de;background:#fcfcfd}
.link-btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 2px 10px rgba(239,75,54,.26)}
.link-btn.primary:hover{background:#e34330}
.link-btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.link-btn.ghost:hover{background:var(--soft);color:var(--ink)}

/* ---------------- 头部介绍 ---------------- */
.hero{max-width:1240px;margin:0 auto;padding:28px 24px 6px}
.hero h1{margin:0;font-size:24px;line-height:1.3;letter-spacing:-.2px}
.hero p{margin:8px 0 0;color:var(--muted);font-size:13.5px;max-width:660px}
.hero .stats{display:flex;gap:18px;margin-top:14px;color:var(--muted);font-size:12px}
.hero .stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:14px;
  margin-right:3px}

/* ---------------- 筛选条 ---------------- */
.filters{max-width:1240px;margin:0 auto;padding:14px 24px 4px;display:flex;
  align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:61px;z-index:15;
  background:linear-gradient(#fff 62%,rgba(255,255,255,.94))}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.cat{height:30px;padding:0 11px;border:1px solid var(--line-2);border-radius:999px;
  background:#fff;font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;
  gap:6px;box-shadow:var(--shadow-1)}
.cat:hover{border-color:#d4d8de}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cat b{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;font-weight:500}
.sort{height:30px;border:1px solid var(--line-2);border-radius:9px;background:#fff;
  font-size:12.5px;padding:0 8px;color:var(--ink-2);box-shadow:var(--shadow-1)}

/* ---------------- 卡片 ---------------- */
.grid{max-width:1240px;margin:0 auto;padding:14px 24px 64px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.card{position:relative;display:flex;flex-direction:column;gap:10px;
  border:1px solid var(--line-2);border-radius:var(--radius);background:#fff;
  padding:16px;box-shadow:var(--shadow-1);text-align:left;
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.card:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(16,24,40,.10);
  border-color:#d6dae0}
.card-head{display:flex;align-items:flex-start;gap:11px}
.avatar{width:44px;height:44px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  font-size:22px;line-height:1;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(16,24,40,.06)}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.sq{border-radius:10px}
.avatar.round{border-radius:50%}
.card-title{min-width:0;flex:1}
.card-name{display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-handle{font-size:11.5px;color:var(--muted-2)}
.star{width:19px;height:19px;border-radius:6px;background:#fff7e6;border:1px solid #f6e3ba;
  color:#b7791f;display:grid;place-items:center;flex:0 0 auto}
.star .ic{width:11px;height:11px;fill:currentColor;stroke:none}
.card-title-text{font-size:12.5px;color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  min-height:37px}
.card-desc{font-size:11.5px;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);
  border-radius:6px;padding:1px 6px}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:4px}
.meta{font-size:11px;color:var(--muted-2);display:flex;align-items:center;gap:4px}
.meta b{color:var(--ink-2);font-weight:500;font-variant-numeric:tabular-nums}
.use{margin-left:auto;height:30px;padding:0 12px;border-radius:9px;border:1px solid var(--line-2);
  background:#fff;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;
  box-shadow:var(--shadow-1)}
.use:hover{border-color:#d4d8de}
.use.on{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 2px 10px rgba(239,75,54,.26)}
.use.on:hover{background:#e34330}
.use.done{background:#eefaf3;border-color:#cdeedd;color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;
  border-radius:6px;background:var(--soft);border:1px solid var(--line-2);
  font-size:10.5px;color:var(--ink-2);white-space:nowrap}
.chip.ok{background:#eefaf3;border-color:#cdeedd;color:var(--ok)}
.chip.warn{background:#fdf7ec;border-color:#f2e2c3;color:var(--warn)}
.chip.danger{background:#fdefef;border-color:#f6d6d6;color:var(--danger)}
.chip.brand{background:var(--brand-soft);border-color:#ffdcd3;color:var(--brand)}

/* 骨架屏 */
.skel{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:#fff;
  height:186px;overflow:hidden;position:relative}
.skel::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(16,24,40,.045),transparent);
  animation:sh 1.3s infinite}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.empty{max-width:1240px;margin:24px auto 80px;padding:44px 24px;text-align:center;
  border:1px dashed var(--line-2);border-radius:18px;color:var(--muted);background:var(--panel)}
.empty h2{margin:0 0 6px;font-size:16px;color:var(--ink)}

/* ---------------- 详情抽屉 ---------------- */
.scrim{position:fixed;inset:0;background:rgba(16,24,40,.28);z-index:40;
  opacity:0;transition:opacity .18s ease}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:41;
  border-left:1px solid var(--line-2);box-shadow:var(--shadow-2);display:flex;flex-direction:column;
  transform:translateX(14px);opacity:0;transition:transform .2s ease,opacity .2s ease}
.drawer.on{transform:none;opacity:1}
.drawer-h{display:flex;align-items:flex-start;gap:12px;padding:18px 18px 14px;
  border-bottom:1px solid var(--line)}
.drawer-h .avatar{width:52px;height:52px;font-size:26px;border-radius:15px}
.drawer-title{min-width:0;flex:1}
.drawer-title h2{margin:0;font-size:17px;line-height:1.35}
.drawer-title .sub{font-size:12px;color:var(--muted);margin-top:3px}
.close{width:28px;height:28px;border:1px solid var(--line-2);border-radius:8px;background:#fff;
  display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow-1)}
.close:hover{background:var(--soft);color:var(--ink)}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px 20px}
.drawer-f{border-top:1px solid var(--line);padding:12px 18px 16px;display:flex;gap:8px;
  align-items:center;background:#fff}
.section{margin-bottom:18px}
.section h3{margin:0 0 7px;font-size:11px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted)}
.prose{font-size:13px;line-height:1.78;color:var(--ink-2);white-space:pre-wrap;
  word-break:break-word}
.starter{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:1px solid var(--line-2);border-radius:10px;background:#fff;padding:9px 11px;
  font-size:12.5px;color:var(--ink-2);margin-bottom:6px;box-shadow:var(--shadow-1)}
.starter:hover{border-color:#d4d8de;background:#fcfcfd}
.starter .ic{color:var(--brand)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12.5px;
  padding:6px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.btn{height:34px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:#fff;
  font-size:13px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-1)}
.btn:hover{border-color:#d4d8de;background:#fcfcfd}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 2px 10px rgba(239,75,54,.26)}
.btn.primary:hover{background:#e34330}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.block{width:100%;justify-content:center}
.spacer{flex:1}

/* 我的投稿 */
.mine{position:fixed;inset:0;z-index:41;display:grid;place-items:center;padding:20px}
.mine-card{width:min(640px,100%);max-height:80vh;background:#fff;border-radius:16px;
  border:1px solid var(--line-2);box-shadow:var(--shadow-2);display:flex;flex-direction:column;
  overflow:hidden}
.mine-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.mine-h h2{margin:0;font-size:15px}
.mine-b{padding:14px 18px;overflow-y:auto}
.mine-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mine-row:last-child{border-bottom:0}
.mine-row .avatar{width:34px;height:34px;font-size:17px;border-radius:10px}
.mine-meta{min-width:0;flex:1}
.mine-name{font-size:13px;font-weight:500;display:flex;align-items:center;gap:6px}
.mine-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);
  background:var(--ink);color:#fff;font-size:12.5px;padding:9px 14px;border-radius:10px;
  box-shadow:0 10px 28px rgba(16,24,40,.22);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .18s ease,transform .18s ease;max-width:min(560px,90vw)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:#b73232}

@media (max-width:760px){
  .top-in{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .search{order:3;width:100%;max-width:none;flex:1 1 100%}
  .hero{padding:20px 16px 2px}
  .hero h1{font-size:20px}
  .filters{padding:12px 16px 4px;top:auto;position:static}
  .grid{padding:12px 16px 56px;grid-template-columns:1fr}
  .top-links .label{display:none}
  .top-links .link-btn{padding:0 9px}
}
</style>

  --t-page:#ffffff;      /* 主内容底 */
  --t-surface:#ffffff;   /* 卡片 / 浮层 / 控件表面（深色下翻成暗面） */
  --t-rail:#f4f7f8;      /* 侧栏 / 轨道底 */
  --t-paper:#f7f9fa;     /* 独立页的纸底 */
  --t-sunken:#eef3f5;    /* 输入框、悬停、内凹 */
  --t-sunken-2:#e4ebee;
  /* 线 */
  --t-line:#e4ebee;
  --t-line-2:#d3dfe4;
  /* 墨（四级） */
  --t-ink:#16252c;
  --t-ink-2:#42565e;
  --t-muted:#5d6b72;
  --t-faint:#60727a;      /* 对比度 5.0 / 4.75 / 4.66，最小号文字也过 AA */
  /* 信号 */
  --t-accent:#0d7480;
  --t-accent-deep:#0a5b65;
  --t-accent-2:#5aa3ab;  /* 同一色相的第二档，只给图表区分系列用 */
  --t-on-accent:#ffffff; /* 压在 accent 实心上的文字色 */
  --t-accent-line:rgba(13,116,128,.38);
  --t-accent-wash:#e9f2f3;
  --t-ok:#17795f;   --t-ok-wash:#e7f4ef;
  --t-warn:#8a5a11; --t-warn-wash:#fbf3e6;
  --t-danger:#b03a3a; --t-danger-wash:#fbeeee;
  /* 尺 */
  --t-r-1:6px; --t-r-2:10px; --t-r-3:12px; --t-r-4:16px;
  /* 影：只给浮层，卡片靠线 */
  --t-sh-1:0 1px 2px rgba(18,38,46,.05);
  --t-sh-2:0 8px 18px -10px rgba(18,38,46,.20), 0 2px 4px rgba(18,38,46,.04);
  --t-sh-3:0 28px 64px -28px rgba(18,38,46,.42);
  /* 动 */
  --t-ease:cubic-bezier(.22,.72,.32,1);
  --t-fast:140ms;
  --t-slow:220ms;
  /* 西文用自托管的 Host Grotesk（latin 子集，内联在 fonts.css），
     汉字逐字回退到系统中文；两者字面宽度接近，不会出现中英混排的锯齿感。 */
  --t-font:"Host Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --t-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
}

/* ---------- 2. 旧令牌重映射（让原有 1.8 万行 CSS 跟着走） ---------- */
html[data-page]{
  --bg:var(--t-page); --panel:var(--t-rail);
  --soft:var(--t-sunken); --soft-2:var(--t-sunken-2);
  --line:var(--t-line); --line-2:var(--t-line-2); --line-soft:var(--t-line);
  --ink:var(--t-ink); --ink-2:var(--t-ink-2); --ink-3:var(--t-muted);
  --muted:var(--t-muted); --muted-2:var(--t-faint);
  --brand:var(--t-accent); --brand-2:var(--t-accent-deep); --brand-soft:var(--t-accent-wash);
  --accent:var(--t-accent); --accent-soft:var(--t-accent-wash); --accent-line:var(--t-line-2);
  --ok:var(--t-ok); --ok-soft:var(--t-ok-wash);
  --warn:var(--t-warn); --warn-soft:var(--t-warn-wash);
  --danger:var(--t-danger); --bad:var(--t-danger); --danger-soft:var(--t-danger-wash);
  --bad-soft:var(--t-danger-wash);
  --shadow-1:var(--t-sh-1); --shadow-2:var(--t-sh-2); --shadow-3:var(--t-sh-3);
  --radius:var(--t-r-3);
}
/* admin 是「纸上的白面板」，底与面板互换 */
html[data-page="admin"]{ --bg:var(--t-paper); --panel:var(--t-page); }
/* plaza 是一整页纸 */
html[data-page="plaza"]{ --bg:var(--t-paper); }

/* ---------- 3. 基座 ---------- */
html[data-page] body{
  font-family:var(--t-font);
  font-size:13.5px;
  line-height:1.65;
  color:var(--t-ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
html[data-page] ::selection{background:rgba(13,116,128,.16);color:var(--t-ink)}
html[data-page] ::-webkit-scrollbar{width:10px;height:10px}
html[data-page] ::-webkit-scrollbar-thumb{
  background:#cfdade;border-radius:10px;border:3px solid transparent;background-clip:content-box}
html[data-page] ::-webkit-scrollbar-thumb:hover{background:#b8c7cc;background-clip:content-box}
html[data-page] ::-webkit-scrollbar-track{background:transparent}

/* 标题：中文不用负字距，改用字重和行高分层 */
html[data-page] h1,html[data-page] h2,html[data-page] h3,html[data-page] h4{
  font-weight:600;letter-spacing:0;line-height:1.28;color:var(--t-ink)}
html[data-page] a{color:var(--t-accent);text-decoration:none;transition:color var(--t-fast) var(--t-ease)}
html[data-page] a:hover{color:var(--t-accent-deep)}
html[data-page] .mono,html[data-page] code,html[data-page] kbd,html[data-page] .num{
  font-family:var(--t-mono);font-feature-settings:"tnum" 1,"zero" 1}
html[data-page] .muted{color:var(--t-muted)}

/* 焦点：键盘一个环，鼠标不出现 */
html[data-page] :where(a,button,input,textarea,select,[tabindex]):focus{outline:none}
html[data-page] :where(a,button,input,textarea,select,[tabindex]):focus-visible{
  outline:2px solid var(--t-accent);outline-offset:2px}

/* ---------- 4. 品牌标记：去掉渐变和光晕 ---------- */
.brand-mark,.hero-mark,.rail-head .brand-mark,.side-head .brand-mark{
  background:var(--t-accent) !important;
  box-shadow:none !important;
  border-radius:8px;
}
.hero-mark{border-radius:10px}
.brand-mark svg,.hero-mark svg{opacity:.96}

/* ---------- 5. 按钮：一套 ---------- */
.btn,.ghost,.primary,.cbtn,.hub-add,.link-btn{
  transition:background var(--t-fast) var(--t-ease),border-color var(--t-fast) var(--t-ease),
             color var(--t-fast) var(--t-ease),box-shadow var(--t-fast) var(--t-ease),
             transform 90ms var(--t-ease);
}
html[data-page] .btn{
  height:32px;padding:0 12px;
  border:1px solid var(--t-line-2);border-radius:var(--t-r-1);
  background:var(--t-surface);color:var(--t-ink);
  font-size:12.5px;font-weight:500;
  box-shadow:none;
}
html[data-page] .btn:hover{border-color:#b9c9cf;background:var(--t-surface);color:var(--t-ink)}
html[data-page] .btn.primary,
html[data-page] .btn.primary:visited{
  background:var(--t-accent);border-color:var(--t-accent);color:var(--t-on-accent);box-shadow:none}
html[data-page] .btn.primary:hover{background:var(--t-accent-deep);border-color:var(--t-accent-deep)}
html[data-page] .btn.ghost{border-color:transparent;background:transparent;color:var(--t-ink-2);box-shadow:none}
html[data-page] .btn.ghost:hover{background:var(--t-sunken);color:var(--t-ink)}
html[data-page] .btn.sm{height:28px;padding:0 9px;font-size:12px}
html[data-page] .btn.danger{color:var(--t-danger)}
html[data-page] .btn.danger:hover{border-color:#e3bcbc;background:var(--t-danger-wash)}
html[data-page] .btn[disabled],html[data-page] .btn:disabled{opacity:.45;cursor:not-allowed}
html[data-page] .btn:not(:disabled):active{transform:translateY(.5px)}

/* index 里的 .ghost / .btn 是同一套 */
html[data-page="hub"] .ghost{
  height:30px;border:1px solid var(--t-line-2);border-radius:var(--t-r-1);
  background:var(--t-surface);color:var(--t-ink-2);font-size:12.5px;box-shadow:none}
html[data-page="hub"] .ghost:hover{border-color:#b9c9cf;background:var(--t-surface);color:var(--t-ink)}
html[data-page="hub"] .ghost.sm{height:28px;font-size:12px}

/* 圆图标按钮 */
.icon-btn{border-radius:var(--t-r-1);transition:background var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease)}
.icon-btn:hover{background:var(--t-sunken-2);color:var(--t-ink)}

/* ---------- 6. 表单 ---------- */
html[data-page] :where(input[type=text],input[type=password],input[type=email],input[type=search],
  input[type=number],input[type=tel],input[type=url],textarea,select){
  border:1px solid var(--t-line-2);border-radius:var(--t-r-1);background:var(--t-surface);color:var(--t-ink);
  font-family:var(--t-font);font-size:13px;
  transition:border-color var(--t-fast) var(--t-ease),box-shadow var(--t-fast) var(--t-ease);
}
html[data-page] :where(input,textarea,select):hover{border-color:#c2cfd5}
html[data-page] :where(input,textarea,select):focus{
  outline:none;border-color:var(--t-accent);box-shadow:0 0 0 3px rgba(13,116,128,.10)}
html[data-page] :where(input,textarea)::placeholder{color:var(--t-faint)}
html[data-page] .field>span,html[data-page] .lbl,html[data-page] .cs-field>span{
  font-size:11.5px;font-weight:500;color:var(--t-muted);letter-spacing:.01em}

/* ---------- 7. 胶囊 / 标签：一套 ---------- */
html[data-page] .chip{
  height:28px;padding:0 12px;border-radius:999px;
  border:1px solid var(--t-line-2);background:var(--t-surface);color:var(--t-ink-2);
  font-size:12.5px;line-height:1;
  transition:background var(--t-fast) var(--t-ease),border-color var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease);
}
html[data-page] .chip:hover{background:var(--t-sunken);border-color:#c2cfd5;color:var(--t-ink)}
html[data-page] .chip.on,html[data-page] .chip.active{
  background:var(--t-accent-wash);border-color:var(--t-accent-line);color:var(--t-accent-deep);font-weight:500}
html[data-page] .pill{
  border-radius:999px;border:1px solid var(--t-line);
  background:var(--t-surface);color:var(--t-muted);font-size:11.5px;font-weight:500;
}
html[data-page] .tag,.nav-item .tag{
  border:1px solid var(--t-line);border-radius:4px;background:transparent;
  color:var(--t-faint);font-size:10px;letter-spacing:.04em;line-height:15px;padding:0 4px}

/* ---------- 8. 卡片：一条线，一个圆角 ---------- */
html[data-page] .card{
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-3);
  box-shadow:none;
}
html[data-page] .panel{
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-3);box-shadow:none}
html[data-page] .panel-h{border-bottom:1px solid var(--t-line)}
html[data-page] .kv b,html[data-page] .kv .v{font-family:var(--t-mono);font-feature-settings:"tnum" 1}

/* 可点的卡片：抬 2px，线变深，浮起来 */
html[data-page] .sug,
html[data-page] .hub-card,
html[data-page] .bot-card,
html[data-page] .skel{
  transition:transform var(--t-slow) var(--t-ease),border-color var(--t-slow) var(--t-ease),
             box-shadow var(--t-slow) var(--t-ease),background var(--t-slow) var(--t-ease);
}

/* ---------- 9. 浮层 ---------- */
html[data-page] :where(.modal,.scrim,.mine){
  background:rgba(18,38,46,.38);
  backdrop-filter:blur(2px);
}
html[data-page] :where(.modal-card,.dialog,.mine-card,.auth-card,.sheet){
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-4);
  box-shadow:var(--t-sh-3);
}
html[data-page] :where(.modal-head,.dialog-h,.mine-h){
  border-bottom:1px solid var(--t-line);padding:14px 18px}
html[data-page] :where(.modal-head,.dialog-h,.mine-h) h2,
html[data-page] :where(.modal-head,.dialog-h,.mine-h) .t{font-size:14px;font-weight:600}
html[data-page] .modal-actions,html[data-page] .dialog-foot{
  border-top:1px solid var(--t-line);padding:12px 18px;gap:8px}

/* ---------- 10. 空态：不再是居中的一坨 ---------- */
html[data-page] .empty{border:1px solid var(--t-line);border-radius:var(--t-r-3);background:var(--t-paper);color:var(--t-muted)}

/* ---------- 11. 动效降级 ---------- */
@media (prefers-reduced-motion:reduce){
  html[data-page] *,html[data-page] *::before,html[data-page] *::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ==================================================================
   12. 主界面 index.html
   ================================================================== */
html[data-page="hub"] .sidebar{background:var(--t-rail);border-right:1px solid var(--t-line)}
html[data-page="hub"] .side-head{padding:12px 12px 10px}
html[data-page="hub"] .brand-name{font-size:13px;font-weight:600;letter-spacing:.01em}
html[data-page="hub"] .brand-ver{font-size:10.5px;color:var(--t-faint)}

/* 新建任务：白底描边，和侧栏分开一层 */
html[data-page="hub"] .new-task{
  height:34px;border-radius:var(--t-r-1);background:var(--t-surface);
  border:1px solid var(--t-line-2);box-shadow:none;
  font-size:12.5px;font-weight:500;color:var(--t-ink);
}
html[data-page="hub"] .new-task:hover{border-color:var(--t-accent);color:var(--t-accent-deep);background:var(--t-surface)}
html[data-page="hub"] .new-task:hover .nt-ico{border-color:rgba(13,116,128,.4);color:var(--t-accent)}
html[data-page="hub"] .new-task .nt-ico{border-radius:4px;border-color:var(--t-line-2);color:var(--t-ink-2)}
html[data-page="hub"] .new-task kbd{border:1px solid var(--t-line);border-radius:4px;color:var(--t-faint);background:var(--t-paper)}
html[data-page="hub"] .search-box{height:30px;border-radius:var(--t-r-1);border-color:var(--t-line-2)}

/* 导航 */
html[data-page="hub"] .nav-item{
  height:32px;border-radius:var(--t-r-1);font-size:13px;color:var(--t-ink-2);
  transition:background var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease);
}
html[data-page="hub"] .nav-item:hover{background:var(--t-sunken-2);color:var(--t-ink)}
html[data-page="hub"] .nav-item.active{
  background:var(--t-surface);border-color:var(--t-line);color:var(--t-ink);font-weight:600;box-shadow:var(--t-sh-1)}
html[data-page="hub"] .nav-item .ic{color:var(--t-muted)}
html[data-page="hub"] .nav-item.active .ic{color:var(--t-accent)}
html[data-page="hub"] .group-head{font-size:11px;font-weight:600;color:var(--t-faint);letter-spacing:.06em}
html[data-page="hub"] .session-item{border-radius:var(--t-r-1);transition:background var(--t-fast) var(--t-ease)}
html[data-page="hub"] .session-item:hover{background:var(--t-sunken-2)}
html[data-page="hub"] .session-item.active{background:var(--t-surface);box-shadow:var(--t-sh-1);border:1px solid var(--t-line)}
html[data-page="hub"] .side-foot{border-top:1px solid var(--t-line)}
html[data-page="hub"] .avatar{
  border-radius:999px;background:var(--t-sunken-2);color:var(--t-ink-2);
  font-size:11px;font-weight:600;letter-spacing:0}
html[data-page="hub"] .user-card{border-radius:var(--t-r-2);padding:5px 6px}
html[data-page="hub"] .user-card:hover{background:var(--t-sunken-2)}
html[data-page="hub"] .user-meta b{font-size:12.5px;font-weight:600}
html[data-page="hub"] .user-meta small{font-size:10.5px;color:var(--t-faint)}

/* 顶栏 */
html[data-page="hub"] .topbar{
  height:48px;border-bottom:1px solid var(--t-line);
  background:rgba(255,255,255,.92);backdrop-filter:saturate(1.1) blur(10px)}
html[data-page="hub"] .crumb{font-size:13px;font-weight:500;color:var(--t-ink)}
/* 登录提示条：一条细带 + 文字动作，别和输入框抢主按钮 */
html[data-page="hub"] .portalbar{
  padding:6px 28px;font-size:12px;color:var(--t-muted);
  background:var(--t-paper);border-bottom:1px solid var(--t-line)}
html[data-page="hub"] .portalbar .btn{
  height:26px;padding:0 8px;border-color:transparent;background:transparent;
  color:var(--t-accent);font-weight:500}
html[data-page="hub"] .portalbar .btn:hover{background:var(--t-sunken);color:var(--t-accent-deep)}
html[data-page="hub"] .conn{height:26px;border:1px solid var(--t-line);border-radius:999px;
  background:var(--t-surface);font-size:11.5px;color:var(--t-muted)}

/* ---------- 空态 / 首屏 ---------- */
html[data-page="hub"] .scroll{padding:0 28px}
html[data-page="hub"] .welcome{
  max-width:720px;margin:0 auto;text-align:left;
  padding:clamp(28px,7vh,64px) 0 20px;
}
/* 眉标：小标记 + 品类 + 分隔 + 版本，一行读完 */
html[data-page="hub"] .wk-eyebrow{
  display:flex;align-items:center;gap:9px;margin:0 0 20px;
  font-size:11.5px;font-weight:500;letter-spacing:.04em;color:var(--t-muted);
}
html[data-page="hub"] .wk-eyebrow .hero-mark{
  width:26px;height:26px;border-radius:7px;margin:0;flex:0 0 auto}
html[data-page="hub"] .wk-eyebrow .hero-mark svg{width:14px;height:14px;display:block}
html[data-page="hub"] .wk-sep{width:1px;height:11px;background:var(--t-line-2)}
html[data-page="hub"] .wk-dim{color:var(--t-faint);letter-spacing:.02em}

html[data-page="hub"] .welcome h1{
  font-size:clamp(25px,2.3vw,32px);line-height:1.36;letter-spacing:-.015em;
  font-weight:600;margin:0 0 12px;max-width:20em;
}
html[data-page="hub"] .wk-br{display:block}
@media (max-width:640px){html[data-page="hub"] .wk-br{display:none}}
html[data-page="hub"] .welcome-sub{
  max-width:33em;margin:0 0 26px;color:var(--t-muted);
  font-size:13.5px;line-height:1.8;
}
/* 场景：一行标签，左边一个说明词，不再是居中的胶囊阵 */
html[data-page="hub"] .wk-scenes{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 26px}
html[data-page="hub"] .wk-scenes-label{
  font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t-faint);flex:0 0 auto}
html[data-page="hub"] .chips{gap:6px;justify-content:flex-start;margin:0;flex-wrap:wrap}
html[data-page="hub"] .chip{height:26px;padding:0 10px;font-size:12px}
html[data-page="hub"] .suggests{
  max-width:none;gap:0;margin-bottom:4px;
  border-top:1px solid var(--t-line);
  display:grid;grid-template-columns:1fr 1fr;column-gap:28px;
}
html[data-page="hub"] .sug{
  align-items:center;gap:12px;padding:15px 0;
  background:transparent;border:0;border-bottom:1px solid var(--t-line);
  border-radius:0;text-align:left;
}
html[data-page="hub"] .sug:hover{background:transparent;box-shadow:none;border-bottom-color:var(--t-line-2)}
html[data-page="hub"] .sug-n{
  font-family:var(--t-mono);font-size:11px;font-weight:500;letter-spacing:.02em;
  color:var(--t-accent);flex:0 0 auto;padding-top:1px;opacity:.85}
html[data-page="hub"] .sug-body b{font-size:13.5px;font-weight:600;color:var(--t-ink);letter-spacing:0;display:block;margin-bottom:2px}
html[data-page="hub"] .sug-body small{font-size:12px;color:var(--t-muted);line-height:1.55}
html[data-page="hub"] .sug-go{
  margin-left:auto;color:var(--t-line-2);display:grid;place-items:center;
  transition:color var(--t-slow) var(--t-ease),transform var(--t-slow) var(--t-ease)}
html[data-page="hub"] .sug-go .ic{transform:rotate(-90deg)}
html[data-page="hub"] .sug:hover .sug-go{color:var(--t-accent);transform:translateX(2px)}
html[data-page="hub"] .sug:hover .sug-body b{color:var(--t-accent-deep)}
@media (max-width:900px){
  html[data-page="hub"] .suggests{grid-template-columns:1fr;column-gap:0}
}

/* ---------- 对话框 ---------- */
html[data-page="hub"] #messages{max-width:720px;padding:20px 0 4px}
html[data-page="hub"] .msg .bubble{
  border-radius:var(--t-r-2);border-bottom-right-radius:4px;
  font-size:13.5px;line-height:1.72;padding:9px 13px}
html[data-page="hub"] .msg.user .bubble{background:var(--t-sunken);color:var(--t-ink)}
html[data-page="hub"] .process-card{border-radius:var(--t-r-3);border:1px solid var(--t-line);background:var(--t-surface)}
html[data-page="hub"] .process-head{background:transparent;border-bottom:1px solid var(--t-line);font-size:12px;color:var(--t-muted)}
html[data-page="hub"] .process-head .dot{background:var(--t-accent);box-shadow:0 0 0 3px rgba(13,116,128,.12)}

/* ---------- Composer ---------- */
html[data-page="hub"] .composer-wrap{padding:10px 28px 14px;background:var(--t-page)}
html[data-page="hub"] .composer{

}

   ================================================================== */

html[data-page] .mcp-actions button.primary:hover,

html[data-page] .form-actions .primary:hover{

/* 内页（技能 / 定时 / 画像 / 记忆 / 灵感）标题与工具条同一条基线 */

html[data-page="hub"] .group-head .group-add:hover{background:var(--t-sunken-2);color:var(--t-ink)}

/* ==================================================================
   19. 图表：JS 里写死的两个色值用 CSS 收回来
   ------------------------------------------------------------------
   admin.html 的 barChart() 把颜色当参数传（#378add / #1d9e75）。
   改 JS 要在三处同步，容易漏；而 CSS 的 fill 声明**优先于 SVG 的
   fill 表现属性**，所以在这里盖掉即可，两条曲线变成同一色相的两档。
   ================================================================== */
html[data-page="admin"] #chartMessages rect{fill:var(--t-accent)}
html[data-page="admin"] #chartUsers rect{fill:var(--t-accent-2)}
html[data-page="admin"] #chartMessages text,
html[data-page="admin"] #chartUsers text{fill:var(--t-faint);font-family:var(--t-mono);font-size:10px}
html[data-page="admin"] #chartMessages line,
html[data-page="admin"] #chartUsers line{stroke:var(--t-line)}

/* ==================================================================
   20. 深色模式（paper & ink 的夜间版）
   ------------------------------------------------------------------
   做法不是"再写一套页面"，而是把同一组令牌翻到暗面——五个页面里
   1.8 万行旧 CSS 都走 var()，翻令牌就跟着走。剩下写死浅色的地方
   在下面第二条规则里逐个收回。
   ================================================================== */
html[data-page][data-theme="dark"]{
  color-scheme:dark;
  --t-page:#131a1d;
  --t-surface:#192328;
  --t-rail:#0e1518;
  --t-paper:#111a1d;
  --t-sunken:#1c262b;
  --t-sunken-2:#243036;
  --t-line:#25333a;
  --t-line-2:#35464e;
  --t-ink:#e8eef0;
  --t-ink-2:#bcc9cf;
  --t-muted:#9aacb4;
  --t-faint:#8d9ea7;
  --t-accent:#54b6c0;
  --t-accent-deep:#79ccd5;
  --t-accent-2:#2e7d86;
  --t-on-accent:#0a1416;
  --t-accent-wash:rgba(84,182,192,.15);
  --t-accent-line:rgba(84,182,192,.45);
  --t-ok:#54c095;     --t-ok-wash:rgba(84,192,149,.14);
  --t-warn:#dcaa63;   --t-warn-wash:rgba(220,170,99,.14);
  --t-danger:#e28484; --t-danger-wash:rgba(226,132,132,.14);
  --t-sh-1:0 1px 2px rgba(0,0,0,.45);
  --t-sh-2:0 10px 22px -12px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.35);
  --t-sh-3:0 28px 64px -28px rgba(0,0,0,.85);
}
/* --bg / --panel 不在这里重设：admin 把这两者对调过，暗色下靠
   --t-page / --t-paper 翻转即可自动正确，重设反而会把那条特例盖掉。 */

/* 写死浅色的表面：顶栏、粘性筛选条、滚动条、选择高亮 */
html[data-page][data-theme="dark"] :where(.topbar,.top,header.top,.filters){
  background:rgba(17,26,29,.9) !important;
  border-color:var(--t-line) !important;
}
html[data-page][data-theme="dark"] ::-webkit-scrollbar-thumb{
  background:#33444b;background-clip:content-box}
html[data-page][data-theme="dark"] ::-webkit-scrollbar-thumb:hover{
  background:#43575f;background-clip:content-box}
html[data-page][data-theme="dark"] ::selection{
  background:rgba(84,182,192,.24);color:var(--t-ink)}
html[data-page][data-theme="dark"] .btn:hover{border-color:var(--t-line-2)}
/* 轻提示原本是"墨底白字"，夜里反过来了：改用暗面 + 亮字，靠一条线定形 */
html[data-page][data-theme="dark"] .toast{
  background:var(--t-surface);color:var(--t-ink);border:1px solid var(--t-line-2);
  box-shadow:var(--t-sh-3)}
html[data-page][data-theme="dark"] .toast.err{
  background:#3a1f1f;color:#f0b7b7;border-color:#5b2e2e}
/* 弹层遮罩在暗底上要更实一点，否则看不清层次 */
html[data-page][data-theme="dark"] :where(.modal,.scrim,.mine){background:rgba(6,10,12,.62)}

/* 消息平台里几处内联白底：返回按钮、选中的渠道行、开关轨道。

<script id="taste-theme">
/* 由 scripts/frontend/taste-layer.js 生成，勿手改 */
/* ==================================================================
   设计层脚本（taste-skill · paper & ink）
   ------------------------------------------------------------------
   只做三件事，不改任何业务逻辑：
     1. 尽早把 data-theme 落到 <html>（避免首帧白闪）；
     2. 往页头插一个主题切换按钮，选择记在 localStorage；
     3. 展示层收口：把裸露的 u_xxxx 换成昵称、把 default 租户说成人话。

   第 3 条是补丁，不是正解——正解是接口直接给 display_name / tenant_name。
   补丁集中在 tidyIdentity() 里，接口改了就能整段删掉。
   ================================================================== */
(function () {
  'use strict';

  var KEY = 'taste-theme';
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function readPref() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function systemTheme() { return mq && mq.matches ? 'dark' : 'light'; }
  function resolve(pref) {
    return (pref === 'light' || pref === 'dark') ? pref : systemTheme();
  }
  function paint(pref) {
    var theme = resolve(pref);
    root.setAttribute('data-theme', theme);
    root.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1518' : '#f7f9fa');
  }

  // ---- 1. 首帧就定下来 ----
  var pref = readPref() || 'auto';
  paint(pref);

  if (mq) {
    var onSystem = function () { if ((readPref() || 'auto') === 'auto') paint('auto'); };
    if (mq.addEventListener) mq.addEventListener('change', onSystem);
    else if (mq.addListener) mq.addListener(onSystem);
  }

  // ---- 2. 切换按钮 ----
  var SUN = '<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.9 5.9l1.5 1.5M16.6 16.6l1.5 1.5M18.1 5.9l-1.5 1.5M7.4 16.6l-1.5 1.5"/></svg>';
  var MOON = '<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.6 8.6 0 1 0 10.4 10.4z"/></svg>';

  // 各页面的页头结构不一样，按优先级找第一个存在的落点。
  // admin 的 .who 是账号信息，按钮插到它前面；其它都是追加到动作区末尾。
  var SLOTS = [
    { sel: '#topActions', mode: 'append' },
    { sel: '.top-links', mode: 'append' },
    { sel: '.top-right', mode: 'append' },
    { sel: '#who', mode: 'before' },
    { sel: '.pane-head .actions', mode: 'append' },
    { sel: '.pane-head', mode: 'append' }
  ];

  function makeButton() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'taste-theme-btn';
    btn.setAttribute('aria-label', '切换深浅色');
    btn.innerHTML = SUN + MOON;
    btn.addEventListener('click', function () {
      var next = resolve(readPref() || 'auto') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      paint(next);
      sync();
    });
    return btn;
  }

  function sync() {
    var btn = document.querySelector('.taste-theme-btn');
    if (!btn) return;
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.title = dark ? '切换到浅色' : '切换到深色';
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }

  function mountButton() {
    if (document.querySelector('.taste-theme-btn')) { sync(); return; }
    for (var i = 0; i < SLOTS.length; i++) {
      var slot = document.querySelector(SLOTS[i].sel);
      if (!slot) continue;
      var btn = makeButton();
      if (SLOTS[i].mode === 'before') slot.parentNode.insertBefore(btn, slot);
      else slot.appendChild(btn);
      sync();
      return;
    }
  }

  // ---- 3. 展示层收口 ----
  var nameCache = null;

  function fetchName(cb) {
    if (nameCache !== null) return cb(nameCache);
    fetch('/api/me', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (me) {
        nameCache = (me && me.display_name) || '';
        cb(nameCache);
      })
      .catch(function () { nameCache = ''; cb(''); });
  }

  // default 是内部租户标识，直接摆给用户看像是没填完的字段
  function humanTenant(text) {
    return text.replace(/(租户\s+|·\s*)default\b/g, '$1默认空间');
  }

  function tidyIdentity() {
    // 管理控制台页头：u_xxxxxxxx → 昵称
    var who = document.getElementById('who');
    if (who) {
      var mono = who.querySelector('.mono');
      if (mono && /^u_[0-9a-f]{10,}$/i.test(mono.textContent.trim())) {
        fetchName(function (name) {
          if (name) mono.textContent = name;
          else mono.textContent = mono.textContent.trim().slice(0, 6) + '…';
        });
      }
      var muted = who.querySelector('.muted');
      if (muted) muted.textContent = humanTenant(muted.textContent);
    }
    // 主界面侧栏：'成员 · default'
    var sub = document.getElementById('userSub');
    if (sub) {
      var t = humanTenant(sub.textContent);
      if (t !== sub.textContent) sub.textContent = t;
    }
  }

  function boot() {
    mountButton();
    tidyIdentity();
    // #who / #userSub 都是 JS 后填的，晚一拍再看一次
    setTimeout(tidyIdentity, 900);
    setTimeout(tidyIdentity, 2400);
    if (window.MutationObserver) {
      var pending = false;
      var mo = new MutationObserver(function () {
        if (pending) return;
        pending = true;
        requestAnimationFrame(function () { pending = false; tidyIdentity(); });
      });
      ['who', 'userSub'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) mo.observe(el, { childList: true, subtree: true, characterData: true });
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>

 * Bot 广场
 *
 * 这个页面只做两件事：把上了架的 Bot 列出来、把「使用」变成一次幂等的启用。
 * 所有状态都来自 /api/bot-plaza/*；页面不缓存任何"我装过什么"——

const api = async (path, opts = {}) => {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', ...(opts.headers || {})},
    ...opts,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch (_) { data = {detail: text}; }
  if (!res.ok) {
    const detail = (data && (data.detail || data.error)) || `HTTP ${res.status}`;
    const err = new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    err.status = res.status;
    throw err;
  }
  return data;
};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const STATUS_TEXT = {pending: '审核中', published: '已上架', rejected: '未通过',
                     offline: '已下架', draft: '草稿'};
const STATUS_KIND = {pending: 'warn', published: 'ok', rejected: 'danger',
                     offline: '', draft: ''};

const S = {
  items: [], categories: [], total: 0, installedCount: 0,
  q: '', category: '', order: 'featured',
  detail: null, loading: false, mine: null,
};

function avatarHtml(bot, size = 44) {
  const shape = bot.shape === 'round' ? ' round' : (bot.shape === 'sq' ? ' sq' : '');
  const bg = bot.color || '#eef4ff';
  const radius = size >= 48 ? 'border-radius:15px' : '';
  if (bot.image) {
    return `<div class="avatar${shape}" style="width:${size}px;height:${size}px;background:${esc(bg)};${radius}">
      <img src="${esc(bot.image)}" alt=""></div>`;
  }
  return `<div class="avatar${shape}" style="width:${size}px;height:${size}px;background:${esc(bg)};
    font-size:${Math.round(size * .5)}px;${radius}">${esc(bot.icon || '🤖')}</div>`;
}

let toastTimer = null;
function toast(msg, isErr) {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast on' + (isErr ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = 'toast' + (isErr ? ' err' : ''); }, isErr ? 4200 : 2200);
}

/* ---------------- 列表 ---------------- */
async function load() {
  if (S.loading) return;
  S.loading = true;
  $('grid').innerHTML = Array.from({length: 6}).map(() => '<div class="skel"></div>').join('');
  $('empty').hidden = true;
  try {
    const params = new URLSearchParams();
    if (S.q) params.set('q', S.q);
    if (S.category) params.set('category', S.category);
    params.set('order', S.order);
    const data = await api('/api/bot-plaza?' + params.toString());
    S.items = data.items || [];
    S.categories = data.categories || [];
    S.total = data.total || 0;
    S.installedCount = data.installed_count || 0;
    render();
  } catch (err) {
    $('grid').innerHTML = '';
    $('empty').hidden = false;
    $('emptyText').textContent = '读取失败：' + err.message;
  } finally {
    S.loading = false;
  }
}

function render() {
  $('statTotal').textContent = S.total;
  $('statCats').textContent = S.categories.filter(c => c.count > 0).length;
  $('statInstalled').textContent = S.installedCount;

  const chips = [`<button class="cat${S.category ? '' : ' on'}" data-cat="">全部
      <b>${S.categories.reduce((sum, c) => sum + (c.count || 0), 0)}</b></button>`];
  for (const cat of S.categories) {
    chips.push(`<button class="cat${S.category === cat.id ? ' on' : ''}" data-cat="${esc(cat.id)}">
      ${esc(cat.name)}<b>${cat.count || 0}</b></button>`);
  }
  $('cats').innerHTML = chips.join('');
  $('cats').querySelectorAll('[data-cat]').forEach(el => {
    el.onclick = () => { S.category = el.dataset.cat; render(); };
  });

  if (!S.items.length) {
    $('grid').innerHTML = '';
    $('empty').hidden = false;
    $('emptyText').textContent = S.q || S.category
      ? '这个筛选下没有 Bot，换个词或看看「全部」。'
      : '还没有人上架 Bot。去工作台创建一个人设，再点「发布到广场」。';
    return;
  }
  $('empty').hidden = true;
  $('grid').innerHTML = S.items.map(cardHtml).join('');
  $('grid').querySelectorAll('[data-item]').forEach(el => {
    el.onclick = (event) => {
      if (event.target.closest('[data-use]')) return;
      openDetail(el.dataset.item);
    };
  });
  $('grid').querySelectorAll('[data-use]').forEach(el => {
    el.onclick = (event) => {
      event.stopPropagation();
      useItem(el.dataset.use, el);
    };
  });
}

function cardHtml(item) {
  const installed = !!item.installed;
  return `<article class="card" data-item="${esc(item.item_id)}" role="button" tabindex="0"
                   aria-label="${esc(item.name)}">
    <div class="card-head">
      ${avatarHtml(item, 44)}
      <div class="card-title">
        <div class="card-name">${esc(item.name)}
          ${item.featured ? '<span class="star" title="平台推荐"><svg class="ic"><use href="#i-star"/></svg></span>' : ''}
          ${installed ? '<span class="chip ok">已启用</span>' : ''}
        </div>
        <div class="card-handle">@${esc(item.handle || 'bot')} · ${esc(categoryName(item.category))}</div>
      </div>
    </div>
    <div class="card-title-text">${esc(item.title || item.description || '还没有写职责')}</div>
    <div class="card-desc">${esc(item.description || '')}</div>
    <div class="tags">${(item.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="card-foot">
      <span class="meta"><b>${item.install_count || 0}</b> 人用过</span>
      <button class="use ${installed ? 'done' : 'on'}" data-use="${esc(item.item_id)}">
        ${installed ? '打开对话' : '使用'}
        <svg class="ic sm"><use href="#i-arrow"/></svg>
      </button>
    </div>
  </article>`;
}

function categoryName(id) {
  const hit = S.categories.find(c => c.id === id);
  return hit ? hit.name : '通用';
}

/* ---------------- 详情 ---------------- */
async function openDetail(itemId) {
  const scrim = $('scrim'), drawer = $('drawer');
  drawer.hidden = false; scrim.hidden = false;
  requestAnimationFrame(() => { drawer.classList.add('on'); scrim.classList.add('on'); });
  $('drawerHead').innerHTML = '<div class="skel" style="width:100%;height:52px;border:0"></div>';
  $('drawerBody').innerHTML = '<div class="skel" style="height:120px"></div>';
  $('drawerFoot').innerHTML = '';
  try {
    const data = await api(`/api/bot-plaza/${encodeURIComponent(itemId)}`);
    S.detail = data;
    renderDetail(data);
  } catch (err) {
    $('drawerBody').innerHTML = `<div class="prose">打开失败：${esc(err.message)}</div>`;
  }
}

function closeDetail() {
  const scrim = $('scrim'), drawer = $('drawer');
  drawer.classList.remove('on'); scrim.classList.remove('on');
  setTimeout(() => { drawer.hidden = true; scrim.hidden = true; S.detail = null; }, 190);
}

function renderDetail(item) {
  $('drawerHead').innerHTML = `
    ${avatarHtml(item, 52)}
    <div class="drawer-title">
      <h2>${esc(item.name)}
        ${item.featured ? '<span class="chip warn">推荐</span>' : ''}
        ${item.installed ? '<span class="chip ok">已启用</span>' : ''}
      </h2>
      <div class="sub">@${esc(item.handle || 'bot')} · ${esc(categoryName(item.category))}
        · ${item.install_count || 0} 人用过</div>
    </div>
    <button class="close" id="drawerClose" aria-label="关闭">
      <svg class="ic sm"><use href="#i-close"/></svg></button>`;
  $('drawerClose').onclick = closeDetail;

  const tags = (item.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const starters = (item.starters || []).map((line, index) => `
    <button class="starter" data-starter="${index}">
      <svg class="ic sm"><use href="#i-spark"/></svg><span>${esc(line)}</span></button>`).join('');
  const readme = item.readme
    ? `<div class="prose">${esc(item.readme)}</div>`
    : `<div class="prose" style="color:var(--muted)">作者没有写详细介绍。</div>`;

  $('drawerBody').innerHTML = `
    <div class="section">
      <h3>它能做什么</h3>
      <div class="prose" style="font-size:13.5px;color:var(--ink)">${esc(item.title || '')}</div>
      <div class="prose" style="margin-top:6px">${esc(item.description || '')}</div>
      ${tags ? `<div class="tags" style="margin-top:10px">${tags}</div>` : ''}
    </div>
    <div class="section">
      <h3>详细介绍</h3>
      ${readme}
    </div>
    ${starters ? `<div class="section"><h3>拿它做这些事</h3>${starters}</div>` : ''}
    <div class="section">
      <h3>它带着什么</h3>
      <div class="kv"><span>人设</span><b>${item.soul ? '已写好（启用后可改）' : '通用助手'}</b></div>
      <div class="kv"><span>技能</span><b>${(item.skill_ids || []).length} 个</b></div>
      <div class="kv"><span>连接器</span><b>${(item.connector_ids || []).length} 个</b></div>
      <div class="kv"><span>模型</span><b>${esc(item.model || '跟随中台默认')}</b></div>
      <div class="kv"><span>版本</span><b>v${item.version || 1}</b></div>
    </div>
    ${item.soul ? `<div class="section"><h3>人设原文（启用后可以改）</h3>
      <div class="prose" style="font-size:12.5px;color:var(--muted);background:var(--panel);
        border:1px solid var(--line-2);border-radius:10px;padding:10px 12px">${esc(item.soul)}</div></div>` : ''}`;

  $('drawerBody').querySelectorAll('[data-starter]').forEach(el => {
    el.onclick = () => {
      const line = (item.starters || [])[Number(el.dataset.starter)] || '';
      useItem(item.item_id, el, line);
    };
  });

  $('drawerFoot').innerHTML = `
    <button class="btn primary" id="detailUse">
      ${item.installed ? '打开对话' : '使用这个 Bot'}
      <svg class="ic sm"><use href="#i-arrow"/></svg></button>
    ${item.installed ? '<button class="btn danger" id="detailUninstall">卸载</button>' : ''}
    <span class="spacer"></span>
    <span class="chip">点「使用」= 在我名下建一份副本</span>`;
  $('detailUse').onclick = () => useItem(item.item_id, $('detailUse'));
  const un = $('detailUninstall');
  if (un) un.onclick = () => uninstall(item.item_id, un);
}

/* ---------------- 启用 / 卸载 ---------------- */
async function useItem(itemId, triggerEl, starterLine) {
  const btn = triggerEl && triggerEl.tagName === 'BUTTON' ? triggerEl : null;
  if (btn) { btn.disabled = true; }
  try {
    const data = await api(`/api/bot-plaza/${encodeURIComponent(itemId)}/install`,
                           {method: 'POST'});
    const target = data.chat_url || `/api/ui/bots?bot=${encodeURIComponent(data.bot_id)}`;
    if (starterLine) {
      // 带一句开场白过去：工作台读取 ?say= 会自动填进输入框，用户只需按回车。
      location.href = `${target}&say=${encodeURIComponent(starterLine)}`;
      return;
    }
    if (data.installed) {
      toast(`已启用「${data.name || '这个 Bot'}」，正在打开对话…`);
    } else {
      toast('你已经有它了，正在打开原来的会话…');
    }
    setTimeout(() => { location.href = target; }, 420);
  } catch (err) {
    toast(err.message, true);
    if (btn) btn.disabled = false;
  }
}

async function uninstall(itemId, btn) {
  if (!confirm('卸载会归档这个机器人（对话历史保留）。要继续吗？')) return;
  btn.disabled = true;
  try {
    await api(`/api/bot-plaza/${encodeURIComponent(itemId)}/install`, {method: 'DELETE'});
    toast('已卸载，机器人已归档');
    closeDetail();
    await load();
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
  }
}

/* ---------------- 我的投稿 ---------------- */
async function openMine() {
  $('mineScrim').hidden = false;
  $('mineBox').hidden = false;
  $('mineBody').innerHTML = '<div class="skel" style="height:80px"></div>';
  try {
    const data = await api('/api/bot-plaza/mine');
    S.mine = data;
    const items = data.items || [];
    const installs = data.installs || [];
    $('mineCount').textContent = `${items.length} 条投稿 · ${installs.length} 个已装`;
    const rows = [];
    for (const item of items) {
      rows.push(`<div class="mine-row">
        ${avatarHtml(item, 34)}
        <div class="mine-meta">
          <div class="mine-name">${esc(item.name)}
            <span class="chip ${STATUS_KIND[item.status] || ''}">${STATUS_TEXT[item.status] || item.status}</span>
            <span class="chip">${item.scope === 'public' ? '全平台' : '本企业'}</span>
          </div>
          <div class="mine-sub">${item.install_count} 人用过 · v${item.version}
            ${item.review_note ? ' · ' + esc(item.review_note) : ''}</div>
        </div>
        <button class="btn" data-open-bot="${esc(item.source_bot_id)}">去工作台</button>
        ${['pending', 'published'].includes(item.status)
          ? `<button class="btn danger" data-withdraw="${esc(item.item_id)}" title="撤回投稿">
               <svg class="ic sm"><use href="#i-trash"/></svg></button>` : ''}
      </div>`);
    }
    if (installs.length) {
      rows.push('<div class="section" style="margin:16px 0 6px"><h3>已装在我名下</h3></div>');
      for (const row of installs) {
        rows.push(`<div class="mine-row">
          <div class="avatar" style="background:${esc(row.color || '#eef4ff')}">${esc(row.icon || '🤖')}</div>
          <div class="mine-meta">
            <div class="mine-name">${esc(row.name || row.item_id)}</div>
            <div class="mine-sub">条目 v${row.item_version} · 装于 ${esc((row.created_at || '').slice(0, 10))}</div>
          </div>
          <a class="btn" href="/api/ui/bots?bot=${encodeURIComponent(row.bot_id)}">打开</a>
        </div>`);
      }
    }
    $('mineBody').innerHTML = rows.length ? rows.join('')
      : `<div class="empty" style="margin:8px 0;padding:28px 16px;border:0;background:transparent">
           <h2>还没有投稿</h2>
           <p>在机器人工作台里选一个自己调好的 Bot，点右侧「发布到广场」。</p>
           <a class="btn primary" href="/api/ui/bots">去工作台</a>
         </div>`;
    $('mineBody').querySelectorAll('[data-open-bot]').forEach(el => {
      el.onclick = () => {
        const botId = el.dataset.openBot;
        location.href = botId ? `/api/ui/bots?bot=${encodeURIComponent(botId)}` : '/api/ui/bots';
      };
    });
    $('mineBody').querySelectorAll('[data-withdraw]').forEach(el => {
      el.onclick = async () => {
        if (!confirm('撤回后这条会从广场下架（已启用它的用户不受影响）。继续吗？')) return;
        try {
          await api(`/api/bot-plaza/mine/${encodeURIComponent(el.dataset.withdraw)}`,
                    {method: 'DELETE'});
          toast('已撤回');
          await openMine();
          await load();
        } catch (err) { toast(err.message, true); }
      };
    });
  } catch (err) {
    $('mineBody').innerHTML = `<div class="prose">读取失败：${esc(err.message)}</div>`;
  }
}

function closeMine() {
  $('mineBox').hidden = true;
  $('mineScrim').hidden = true;
}

/* ---------------- 交互 ---------------- */
let searchTimer = null;
$('q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { S.q = $('q').value.trim(); load(); }, 220);
});
$('order').addEventListener('change', () => { S.order = $('order').value; load(); });
$('scrim').onclick = closeDetail;
$('mineScrim').onclick = closeMine;
$('mineClose').onclick = closeMine;
$('mineBtn').onclick = openMine;
document.addEventListener('keydown', event => {
  if (event.key === 'Escape') {
    if (!$('mineBox').hidden) { closeMine(); return; }
    if (!$('drawer').hidden) closeDetail();
  }
  if (event.key === '/' && document.activeElement !== $('q')) {
    event.preventDefault();
    $('q').focus();
  }
});
$('grid').addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.target.dataset.item) openDetail(event.target.dataset.item);
});

/* 从工作台「发布到广场」跳回来时带 ?mine=1：直接把投稿面板打开。 */
load().then(() => {
  const params = new URLSearchParams(location.search);
  if (params.get('mine')) openMine();
  if (params.get('q')) { $('q').value = params.get('q'); S.q = params.get('q'); load(); }
});
</script>
