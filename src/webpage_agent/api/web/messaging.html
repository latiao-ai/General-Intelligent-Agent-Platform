<!DOCTYPE html>
<html lang="zh-CN" data-page="messaging">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息平台 · 飞书 / 企业微信 / 个人微信</title>
<style>
:root{
  --bg:#ffffff; --panel:#f7f7f8; --soft:#eef0f2; --soft-2:#e4e7ea;
  --line:#eff1f4; --line-2:#e2e5e9;
  --ink:#15171a; --ink-2:#3f444b; --muted:#8a8f99; --muted-2:#a9aeb7;
  --brand:#ef4b36; --brand-2:#ff7a5c; --brand-soft:#fff3f0;
  --ok:#129a5a; --ok-soft:#eefaf3; --warn:#b7791f; --warn-soft:#fdf7ec;
  --danger:#d64545; --danger-soft:#fdefef;
  --shadow-1:0 1px 2px rgba(16,24,40,.05);
  --shadow-2:0 16px 38px rgba(16,24,40,.12);
  --rail-w:272px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline}
input,textarea,select{font:inherit;color:inherit}
code{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ic{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:13px;height:13px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#dcdfe4;border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#cdd1d7;background-clip:content-box}

.app{display:flex;height:100vh;min-height:0}

/* ---------------- 左栏 ---------------- */
.rail{width:var(--rail-w);flex:0 0 var(--rail-w);background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
.brand-mark{width:30px;height:30px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(150deg,#ff8a63,#ef3d2b 62%,#e0361f);display:grid;place-items:center;
  box-shadow:0 4px 10px rgba(239,61,43,.26),inset 0 1px 0 rgba(255,255,255,.28)}
.brand-text{min-width:0;flex:1}
.brand-name{font-size:13.5px;font-weight:650;letter-spacing:.1px}
.brand-ver{font-size:10.5px;color:var(--muted-2)}
.icon-btn{width:26px;height:26px;border:0;border-radius:7px;background:transparent;
  color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--soft-2);color:var(--ink)}
.rail-pad{padding:0 14px 8px}
.nav{display:flex;flex-direction:column;gap:2px;padding:4px 14px 8px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;
  border:1px solid transparent;border-radius:9px;background:transparent;color:var(--ink-2);
  font-size:13px;text-align:left}
.nav-item:hover{background:var(--soft)}
.nav-item.active{background:#fff;border-color:var(--line-2);color:var(--ink);font-weight:500;
  box-shadow:var(--shadow-1)}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.rail-scroll{flex:1;min-height:0;overflow-y:auto;padding:2px 14px 10px}
.group-head{display:flex;align-items:center;gap:6px;padding:12px 4px 6px;color:var(--muted);
  font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.group-head b{margin-left:auto;font-weight:500;color:var(--muted-2);font-size:10.5px}
.ch-row{display:flex;align-items:center;gap:10px;width:100%;padding:9px 9px;border:1px solid transparent;
  border-radius:11px;background:transparent;text-align:left}
.ch-row:hover{background:var(--soft)}
.ch-row.active{background:#fff;border-color:var(--line-2);box-shadow:var(--shadow-1)}
.ch-mark{width:32px;height:32px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-size:15px;font-weight:650;color:#fff;box-shadow:inset 0 0 0 1px rgba(16,24,40,.06)}
.ch-meta{min-width:0;flex:1}
.ch-name{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:550;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--muted-2)}
.dot.good{background:var(--ok);box-shadow:0 0 0 3px rgba(18,154,90,.12)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(183,121,31,.12)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px rgba(214,69,69,.12)}
.dot.muted{background:var(--muted-2)}
.rail-foot{border-top:1px solid var(--line);padding:9px 14px}
.gw{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.gw b{font-weight:550;color:var(--ink-2)}

/* ---------------- 主区 ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;background:#fff}
.topbar{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);
  min-height:64px}
.crumb{display:flex;align-items:center;gap:11px;min-width:0;flex:1}
.crumb .ch-mark{width:36px;height:36px;font-size:16px}
.crumb-body{min-width:0}
.crumb-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:650;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb-sub{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-right{display:flex;align-items:center;gap:7px}
.btn{height:31px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:#fff;
  font-size:12.5px;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow-1)}
.btn:hover{border-color:#d4d8de;background:#fcfcfd}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;
  box-shadow:0 2px 8px rgba(239,75,54,.25)}
.btn.primary:hover{background:#e34330}
.btn.ghost{background:transparent;box-shadow:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft);color:var(--ink)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--danger);border-color:#f2d5d5}
.btn.danger:hover{background:var(--danger-soft)}

.content{flex:1;min-height:0;overflow-y:auto;background:var(--panel)}
.canvas{max-width:960px;margin:0 auto;padding:20px 24px 48px;display:flex;flex-direction:column;gap:14px}
.banner{display:flex;align-items:flex-start;gap:10px;border:1px solid #f2e2c3;background:var(--warn-soft);
  color:#7a5316;border-radius:11px;padding:11px 13px;font-size:12.5px}
.banner.bad{border-color:#f6d6d6;background:var(--danger-soft);color:#8b2f2f}
.banner.ok{border-color:#cdeedd;background:var(--ok-soft);color:#0d6b3f}
.banner .ic{margin-top:1px}
.banner b{font-weight:650}

.card{background:#fff;border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-1)}
.card-head{display:flex;align-items:center;gap:9px;padding:14px 16px 0}
.card-title{font-size:13.5px;font-weight:650}
.card-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.card-body{padding:13px 16px 16px}
.card-head .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;
  background:var(--soft);border:1px solid var(--line-2);font-size:10.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:#cdeedd;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:#f2e2c3;color:var(--warn)}
.chip.danger{background:var(--danger-soft);border-color:#f6d6d6;color:var(--danger)}
.chip.brand{background:var(--brand-soft);border-color:#ffdcd3;color:var(--brand)}
.mono{font:11.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 14px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;word-break:break-word}

.steps{display:flex;flex-direction:column;gap:9px;counter-reset:step}
.step{display:flex;gap:10px;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.step:before{counter-increment:step;content:counter(step);width:19px;height:19px;flex:0 0 auto;
  border-radius:50%;background:var(--brand-soft);color:var(--brand);font-size:10.5px;font-weight:650;
  display:grid;place-items:center;margin-top:2px}

.callback{display:flex;gap:8px;align-items:center;margin-top:10px}
.callback code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:7px 9px}

.field{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.field:last-child{border-bottom:0}
.field .f-main{min-width:0;flex:1}
.field .f-label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:550}
.field .f-help{font-size:11px;color:var(--muted);margin-top:1px}
.field .f-env{font-size:10.5px;color:var(--muted-2);margin-top:2px}
.field .f-side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.req{color:var(--brand);font-size:10px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.form-grid .full{grid-column:1 / -1}
.lbl{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line-2);border-radius:9px;
  background:#fff;padding:8px 10px;font-size:12.5px;outline:none}
.input:focus{border-color:#d0b3ff;box-shadow:0 0 0 3px rgba(239,75,54,.08)}
textarea.input{resize:vertical;min-height:64px}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}

.qr-wrap{display:flex;gap:20px;align-items:flex-start}
.qr-box{width:176px;height:176px;flex:0 0 auto;border:1px solid var(--line-2);border-radius:14px;
  background:#fff;display:grid;place-items:center;overflow:hidden;padding:8px}
.qr-box img{width:100%;height:100%;object-fit:contain}
.qr-empty{color:var(--muted-2);font-size:11.5px;text-align:center;padding:0 12px;line-height:1.7}
.qr-side{min-width:0;flex:1}
.qr-status{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.qr-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.7}
.qr-meta{font-size:11px;color:var(--muted-2);margin-top:10px;word-break:break-all}

table.events{width:100%;border-collapse:collapse;font-size:11.5px}
table.events th{text-align:left;color:var(--muted);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
table.events td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink-2);
  font-variant-numeric:tabular-nums}
table.events tr:last-child td{border-bottom:0}
.empty{color:var(--muted-2);font-size:12px;padding:12px 2px}

.pair-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pair-row:last-child{border-bottom:0}
.pair-row .who{min-width:0;flex:1;font-size:12.5px}
.pair-row .who small{display:block;color:var(--muted);font-size:10.5px}
.pair-form{display:flex;gap:8px;margin-top:6px}
.pair-form .input{max-width:220px;letter-spacing:2px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);
  background:#16181d;color:#fff;border-radius:10px;padding:9px 14px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:60;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:#8b2f2f}

.switch{position:relative;width:38px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#d9dde2;border-radius:99px;transition:.18s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.18s}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span:before{transform:translateX(16px)}

@media(max-width:980px){
  :root{--rail-w:232px}
  .canvas{padding:16px}
  .form-grid{grid-template-columns:1fr}
  .qr-wrap{flex-direction:column}
  .kv{grid-template-columns:1fr}
}
@media(max-width:720px){
  .rail{display:none}
  .canvas{padding:14px}
}
</style>

  --t-page:#ffffff;      /* 主内容底 */
  --t-surface:#ffffff;   /* 卡片 / 浮层 / 控件表面（深色下翻成暗面） */
  --t-rail:#f4f7f8;      /* 侧栏 / 轨道底 */
  --t-paper:#f7f9fa;     /* 独立页的纸底 */
  --t-sunken:#eef3f5;    /* 输入框、悬停、内凹 */
  --t-sunken-2:#e4ebee;
  /* 线 */
  --t-line:#e4ebee;
  --t-line-2:#d3dfe4;
  /* 墨（四级） */
  --t-ink:#16252c;
  --t-ink-2:#42565e;
  --t-muted:#5d6b72;
  --t-faint:#60727a;      /* 对比度 5.0 / 4.75 / 4.66，最小号文字也过 AA */
  /* 信号 */
  --t-accent:#0d7480;
  --t-accent-deep:#0a5b65;
  --t-accent-2:#5aa3ab;  /* 同一色相的第二档，只给图表区分系列用 */
  --t-on-accent:#ffffff; /* 压在 accent 实心上的文字色 */
  --t-accent-line:rgba(13,116,128,.38);
  --t-accent-wash:#e9f2f3;
  --t-ok:#17795f;   --t-ok-wash:#e7f4ef;
  --t-warn:#8a5a11; --t-warn-wash:#fbf3e6;
  --t-danger:#b03a3a; --t-danger-wash:#fbeeee;
  /* 尺 */
  --t-r-1:6px; --t-r-2:10px; --t-r-3:12px; --t-r-4:16px;
  /* 影：只给浮层，卡片靠线 */
  --t-sh-1:0 1px 2px rgba(18,38,46,.05);
  --t-sh-2:0 8px 18px -10px rgba(18,38,46,.20), 0 2px 4px rgba(18,38,46,.04);
  --t-sh-3:0 28px 64px -28px rgba(18,38,46,.42);
  /* 动 */
  --t-ease:cubic-bezier(.22,.72,.32,1);
  --t-fast:140ms;
  --t-slow:220ms;
  /* 西文用自托管的 Host Grotesk（latin 子集，内联在 fonts.css），
     汉字逐字回退到系统中文；两者字面宽度接近，不会出现中英混排的锯齿感。 */
  --t-font:"Host Grotesk",-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  --t-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"PingFang SC",monospace;
}

/* ---------- 2. 旧令牌重映射（让原有 1.8 万行 CSS 跟着走） ---------- */
html[data-page]{
  --bg:var(--t-page); --panel:var(--t-rail);
  --soft:var(--t-sunken); --soft-2:var(--t-sunken-2);
  --line:var(--t-line); --line-2:var(--t-line-2); --line-soft:var(--t-line);
  --ink:var(--t-ink); --ink-2:var(--t-ink-2); --ink-3:var(--t-muted);
  --muted:var(--t-muted); --muted-2:var(--t-faint);
  --brand:var(--t-accent); --brand-2:var(--t-accent-deep); --brand-soft:var(--t-accent-wash);
  --accent:var(--t-accent); --accent-soft:var(--t-accent-wash); --accent-line:var(--t-line-2);
  --ok:var(--t-ok); --ok-soft:var(--t-ok-wash);
  --warn:var(--t-warn); --warn-soft:var(--t-warn-wash);
  --danger:var(--t-danger); --bad:var(--t-danger); --danger-soft:var(--t-danger-wash);
  --bad-soft:var(--t-danger-wash);
  --shadow-1:var(--t-sh-1); --shadow-2:var(--t-sh-2); --shadow-3:var(--t-sh-3);
  --radius:var(--t-r-3);
}
/* admin 是「纸上的白面板」，底与面板互换 */
html[data-page="admin"]{ --bg:var(--t-paper); --panel:var(--t-page); }
/* plaza 是一整页纸 */
html[data-page="plaza"]{ --bg:var(--t-paper); }

/* ---------- 3. 基座 ---------- */
html[data-page] body{
  font-family:var(--t-font);
  font-size:13.5px;
  line-height:1.65;
  color:var(--t-ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
html[data-page] ::selection{background:rgba(13,116,128,.16);color:var(--t-ink)}
html[data-page] ::-webkit-scrollbar{width:10px;height:10px}
html[data-page] ::-webkit-scrollbar-thumb{
  background:#cfdade;border-radius:10px;border:3px solid transparent;background-clip:content-box}
html[data-page] ::-webkit-scrollbar-thumb:hover{background:#b8c7cc;background-clip:content-box}
html[data-page] ::-webkit-scrollbar-track{background:transparent}

/* 标题：中文不用负字距，改用字重和行高分层 */
html[data-page] h1,html[data-page] h2,html[data-page] h3,html[data-page] h4{
  font-weight:600;letter-spacing:0;line-height:1.28;color:var(--t-ink)}
html[data-page] a{color:var(--t-accent);text-decoration:none;transition:color var(--t-fast) var(--t-ease)}
html[data-page] a:hover{color:var(--t-accent-deep)}
html[data-page] .mono,html[data-page] code,html[data-page] kbd,html[data-page] .num{
  font-family:var(--t-mono);font-feature-settings:"tnum" 1,"zero" 1}
html[data-page] .muted{color:var(--t-muted)}

/* 焦点：键盘一个环，鼠标不出现 */
html[data-page] :where(a,button,input,textarea,select,[tabindex]):focus{outline:none}
html[data-page] :where(a,button,input,textarea,select,[tabindex]):focus-visible{
  outline:2px solid var(--t-accent);outline-offset:2px}

/* ---------- 4. 品牌标记：去掉渐变和光晕 ---------- */
.brand-mark,.hero-mark,.rail-head .brand-mark,.side-head .brand-mark{
  background:var(--t-accent) !important;
  box-shadow:none !important;
  border-radius:8px;
}
.hero-mark{border-radius:10px}
.brand-mark svg,.hero-mark svg{opacity:.96}

/* ---------- 5. 按钮：一套 ---------- */
.btn,.ghost,.primary,.cbtn,.hub-add,.link-btn{
  transition:background var(--t-fast) var(--t-ease),border-color var(--t-fast) var(--t-ease),
             color var(--t-fast) var(--t-ease),box-shadow var(--t-fast) var(--t-ease),
             transform 90ms var(--t-ease);
}
html[data-page] .btn{
  height:32px;padding:0 12px;
  border:1px solid var(--t-line-2);border-radius:var(--t-r-1);
  background:var(--t-surface);color:var(--t-ink);
  font-size:12.5px;font-weight:500;
  box-shadow:none;
}
html[data-page] .btn:hover{border-color:#b9c9cf;background:var(--t-surface);color:var(--t-ink)}
html[data-page] .btn.primary,
html[data-page] .btn.primary:visited{
  background:var(--t-accent);border-color:var(--t-accent);color:var(--t-on-accent);box-shadow:none}
html[data-page] .btn.primary:hover{background:var(--t-accent-deep);border-color:var(--t-accent-deep)}
html[data-page] .btn.ghost{border-color:transparent;background:transparent;color:var(--t-ink-2);box-shadow:none}
html[data-page] .btn.ghost:hover{background:var(--t-sunken);color:var(--t-ink)}
html[data-page] .btn.sm{height:28px;padding:0 9px;font-size:12px}
html[data-page] .btn.danger{color:var(--t-danger)}
html[data-page] .btn.danger:hover{border-color:#e3bcbc;background:var(--t-danger-wash)}
html[data-page] .btn[disabled],html[data-page] .btn:disabled{opacity:.45;cursor:not-allowed}
html[data-page] .btn:not(:disabled):active{transform:translateY(.5px)}

/* index 里的 .ghost / .btn 是同一套 */
html[data-page="hub"] .ghost{
  height:30px;border:1px solid var(--t-line-2);border-radius:var(--t-r-1);
  background:var(--t-surface);color:var(--t-ink-2);font-size:12.5px;box-shadow:none}
html[data-page="hub"] .ghost:hover{border-color:#b9c9cf;background:var(--t-surface);color:var(--t-ink)}
html[data-page="hub"] .ghost.sm{height:28px;font-size:12px}

/* 圆图标按钮 */
.icon-btn{border-radius:var(--t-r-1);transition:background var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease)}
.icon-btn:hover{background:var(--t-sunken-2);color:var(--t-ink)}

/* ---------- 6. 表单 ---------- */
html[data-page] :where(input[type=text],input[type=password],input[type=email],input[type=search],
  input[type=number],input[type=tel],input[type=url],textarea,select){
  border:1px solid var(--t-line-2);border-radius:var(--t-r-1);background:var(--t-surface);color:var(--t-ink);
  font-family:var(--t-font);font-size:13px;
  transition:border-color var(--t-fast) var(--t-ease),box-shadow var(--t-fast) var(--t-ease);
}
html[data-page] :where(input,textarea,select):hover{border-color:#c2cfd5}
html[data-page] :where(input,textarea,select):focus{
  outline:none;border-color:var(--t-accent);box-shadow:0 0 0 3px rgba(13,116,128,.10)}
html[data-page] :where(input,textarea)::placeholder{color:var(--t-faint)}
html[data-page] .field>span,html[data-page] .lbl,html[data-page] .cs-field>span{
  font-size:11.5px;font-weight:500;color:var(--t-muted);letter-spacing:.01em}

/* ---------- 7. 胶囊 / 标签：一套 ---------- */
html[data-page] .chip{
  height:28px;padding:0 12px;border-radius:999px;
  border:1px solid var(--t-line-2);background:var(--t-surface);color:var(--t-ink-2);
  font-size:12.5px;line-height:1;
  transition:background var(--t-fast) var(--t-ease),border-color var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease);
}
html[data-page] .chip:hover{background:var(--t-sunken);border-color:#c2cfd5;color:var(--t-ink)}
html[data-page] .chip.on,html[data-page] .chip.active{
  background:var(--t-accent-wash);border-color:var(--t-accent-line);color:var(--t-accent-deep);font-weight:500}
html[data-page] .pill{
  border-radius:999px;border:1px solid var(--t-line);
  background:var(--t-surface);color:var(--t-muted);font-size:11.5px;font-weight:500;
}
html[data-page] .tag,.nav-item .tag{
  border:1px solid var(--t-line);border-radius:4px;background:transparent;
  color:var(--t-faint);font-size:10px;letter-spacing:.04em;line-height:15px;padding:0 4px}

/* ---------- 8. 卡片：一条线，一个圆角 ---------- */
html[data-page] .card{
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-3);
  box-shadow:none;
}
html[data-page] .panel{
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-3);box-shadow:none}
html[data-page] .panel-h{border-bottom:1px solid var(--t-line)}
html[data-page] .kv b,html[data-page] .kv .v{font-family:var(--t-mono);font-feature-settings:"tnum" 1}

/* 可点的卡片：抬 2px，线变深，浮起来 */
html[data-page] .sug,
html[data-page] .hub-card,
html[data-page] .bot-card,
html[data-page] .skel{
  transition:transform var(--t-slow) var(--t-ease),border-color var(--t-slow) var(--t-ease),
             box-shadow var(--t-slow) var(--t-ease),background var(--t-slow) var(--t-ease);
}

/* ---------- 9. 浮层 ---------- */
html[data-page] :where(.modal,.scrim,.mine){
  background:rgba(18,38,46,.38);
  backdrop-filter:blur(2px);
}
html[data-page] :where(.modal-card,.dialog,.mine-card,.auth-card,.sheet){
  background:var(--t-surface);border:1px solid var(--t-line);border-radius:var(--t-r-4);
  box-shadow:var(--t-sh-3);
}
html[data-page] :where(.modal-head,.dialog-h,.mine-h){
  border-bottom:1px solid var(--t-line);padding:14px 18px}
html[data-page] :where(.modal-head,.dialog-h,.mine-h) h2,
html[data-page] :where(.modal-head,.dialog-h,.mine-h) .t{font-size:14px;font-weight:600}
html[data-page] .modal-actions,html[data-page] .dialog-foot{
  border-top:1px solid var(--t-line);padding:12px 18px;gap:8px}

/* ---------- 10. 空态：不再是居中的一坨 ---------- */
html[data-page] .empty{border:1px solid var(--t-line);border-radius:var(--t-r-3);background:var(--t-paper);color:var(--t-muted)}

/* ---------- 11. 动效降级 ---------- */
@media (prefers-reduced-motion:reduce){
  html[data-page] *,html[data-page] *::before,html[data-page] *::after{
    animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important;scroll-behavior:auto !important}
}

/* ==================================================================
   12. 主界面 index.html
   ================================================================== */
html[data-page="hub"] .sidebar{background:var(--t-rail);border-right:1px solid var(--t-line)}
html[data-page="hub"] .side-head{padding:12px 12px 10px}
html[data-page="hub"] .brand-name{font-size:13px;font-weight:600;letter-spacing:.01em}
html[data-page="hub"] .brand-ver{font-size:10.5px;color:var(--t-faint)}

/* 新建任务：白底描边，和侧栏分开一层 */
html[data-page="hub"] .new-task{
  height:34px;border-radius:var(--t-r-1);background:var(--t-surface);
  border:1px solid var(--t-line-2);box-shadow:none;
  font-size:12.5px;font-weight:500;color:var(--t-ink);
}
html[data-page="hub"] .new-task:hover{border-color:var(--t-accent);color:var(--t-accent-deep);background:var(--t-surface)}
html[data-page="hub"] .new-task:hover .nt-ico{border-color:rgba(13,116,128,.4);color:var(--t-accent)}
html[data-page="hub"] .new-task .nt-ico{border-radius:4px;border-color:var(--t-line-2);color:var(--t-ink-2)}
html[data-page="hub"] .new-task kbd{border:1px solid var(--t-line);border-radius:4px;color:var(--t-faint);background:var(--t-paper)}
html[data-page="hub"] .search-box{height:30px;border-radius:var(--t-r-1);border-color:var(--t-line-2)}

/* 导航 */
html[data-page="hub"] .nav-item{
  height:32px;border-radius:var(--t-r-1);font-size:13px;color:var(--t-ink-2);
  transition:background var(--t-fast) var(--t-ease),color var(--t-fast) var(--t-ease);
}
html[data-page="hub"] .nav-item:hover{background:var(--t-sunken-2);color:var(--t-ink)}
html[data-page="hub"] .nav-item.active{
  background:var(--t-surface);border-color:var(--t-line);color:var(--t-ink);font-weight:600;box-shadow:var(--t-sh-1)}
html[data-page="hub"] .nav-item .ic{color:var(--t-muted)}
html[data-page="hub"] .nav-item.active .ic{color:var(--t-accent)}
html[data-page="hub"] .group-head{font-size:11px;font-weight:600;color:var(--t-faint);letter-spacing:.06em}
html[data-page="hub"] .session-item{border-radius:var(--t-r-1);transition:background var(--t-fast) var(--t-ease)}
html[data-page="hub"] .session-item:hover{background:var(--t-sunken-2)}
html[data-page="hub"] .session-item.active{background:var(--t-surface);box-shadow:var(--t-sh-1);border:1px solid var(--t-line)}
html[data-page="hub"] .side-foot{border-top:1px solid var(--t-line)}
html[data-page="hub"] .avatar{
  border-radius:999px;background:var(--t-sunken-2);color:var(--t-ink-2);
  font-size:11px;font-weight:600;letter-spacing:0}
html[data-page="hub"] .user-card{border-radius:var(--t-r-2);padding:5px 6px}
html[data-page="hub"] .user-card:hover{background:var(--t-sunken-2)}
html[data-page="hub"] .user-meta b{font-size:12.5px;font-weight:600}
html[data-page="hub"] .user-meta small{font-size:10.5px;color:var(--t-faint)}

/* 顶栏 */
html[data-page="hub"] .topbar{
  height:48px;border-bottom:1px solid var(--t-line);
  background:rgba(255,255,255,.92);backdrop-filter:saturate(1.1) blur(10px)}
html[data-page="hub"] .crumb{font-size:13px;font-weight:500;color:var(--t-ink)}
/* 登录提示条：一条细带 + 文字动作，别和输入框抢主按钮 */
html[data-page="hub"] .portalbar{
  padding:6px 28px;font-size:12px;color:var(--t-muted);
  background:var(--t-paper);border-bottom:1px solid var(--t-line)}
html[data-page="hub"] .portalbar .btn{
  height:26px;padding:0 8px;border-color:transparent;background:transparent;
  color:var(--t-accent);font-weight:500}
html[data-page="hub"] .portalbar .btn:hover{background:var(--t-sunken);color:var(--t-accent-deep)}
html[data-page="hub"] .conn{height:26px;border:1px solid var(--t-line);border-radius:999px;
  background:var(--t-surface);font-size:11.5px;color:var(--t-muted)}

/* ---------- 空态 / 首屏 ---------- */
html[data-page="hub"] .scroll{padding:0 28px}
html[data-page="hub"] .welcome{
  max-width:720px;margin:0 auto;text-align:left;
  padding:clamp(28px,7vh,64px) 0 20px;
}
/* 眉标：小标记 + 品类 + 分隔 + 版本，一行读完 */
html[data-page="hub"] .wk-eyebrow{
  display:flex;align-items:center;gap:9px;margin:0 0 20px;
  font-size:11.5px;font-weight:500;letter-spacing:.04em;color:var(--t-muted);
}
html[data-page="hub"] .wk-eyebrow .hero-mark{
  width:26px;height:26px;border-radius:7px;margin:0;flex:0 0 auto}
html[data-page="hub"] .wk-eyebrow .hero-mark svg{width:14px;height:14px;display:block}
html[data-page="hub"] .wk-sep{width:1px;height:11px;background:var(--t-line-2)}
html[data-page="hub"] .wk-dim{color:var(--t-faint);letter-spacing:.02em}

html[data-page="hub"] .welcome h1{
  font-size:clamp(25px,2.3vw,32px);line-height:1.36;letter-spacing:-.015em;
  font-weight:600;margin:0 0 12px;max-width:20em;
}
html[data-page="hub"] .wk-br{display:block}
@media (max-width:640px){html[data-page="hub"] .wk-br{display:none}}
html[data-page="hub"] .welcome-sub{
  max-width:33em;margin:0 0 26px;color:var(--t-muted);
  font-size:13.5px;line-height:1.8;
}
/* 场景：一行标签，左边一个说明词，不再是居中的胶囊阵 */
html[data-page="hub"] .wk-scenes{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 26px}
html[data-page="hub"] .wk-scenes-label{
  font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--t-faint);flex:0 0 auto}
html[data-page="hub"] .chips{gap:6px;justify-content:flex-start;margin:0;flex-wrap:wrap}
html[data-page="hub"] .chip{height:26px;padding:0 10px;font-size:12px}
html[data-page="hub"] .suggests{
  max-width:none;gap:0;margin-bottom:4px;
  border-top:1px solid var(--t-line);
  display:grid;grid-template-columns:1fr 1fr;column-gap:28px;
}
html[data-page="hub"] .sug{
  align-items:center;gap:12px;padding:15px 0;
  background:transparent;border:0;border-bottom:1px solid var(--t-line);
  border-radius:0;text-align:left;
}
html[data-page="hub"] .sug:hover{background:transparent;box-shadow:none;border-bottom-color:var(--t-line-2)}
html[data-page="hub"] .sug-n{
  font-family:var(--t-mono);font-size:11px;font-weight:500;letter-spacing:.02em;
  color:var(--t-accent);flex:0 0 auto;padding-top:1px;opacity:.85}
html[data-page="hub"] .sug-body b{font-size:13.5px;font-weight:600;color:var(--t-ink);letter-spacing:0;display:block;margin-bottom:2px}
html[data-page="hub"] .sug-body small{font-size:12px;color:var(--t-muted);line-height:1.55}
html[data-page="hub"] .sug-go{
  margin-left:auto;color:var(--t-line-2);display:grid;place-items:center;
  transition:color var(--t-slow) var(--t-ease),transform var(--t-slow) var(--t-ease)}
html[data-page="hub"] .sug-go .ic{transform:rotate(-90deg)}
html[data-page="hub"] .sug:hover .sug-go{color:var(--t-accent);transform:translateX(2px)}
html[data-page="hub"] .sug:hover .sug-body b{color:var(--t-accent-deep)}
@media (max-width:900px){
  html[data-page="hub"] .suggests{grid-template-columns:1fr;column-gap:0}
}

/* ---------- 对话框 ---------- */
html[data-page="hub"] #messages{max-width:720px;padding:20px 0 4px}
html[data-page="hub"] .msg .bubble{
  border-radius:var(--t-r-2);border-bottom-right-radius:4px;
  font-size:13.5px;line-height:1.72;padding:9px 13px}
html[data-page="hub"] .msg.user .bubble{background:var(--t-sunken);color:var(--t-ink)}
html[data-page="hub"] .process-card{border-radius:var(--t-r-3);border:1px solid var(--t-line);background:var(--t-surface)}
html[data-page="hub"] .process-head{background:transparent;border-bottom:1px solid var(--t-line);font-size:12px;color:var(--t-muted)}
html[data-page="hub"] .process-head .dot{background:var(--t-accent);box-shadow:0 0 0 3px rgba(13,116,128,.12)}

/* ---------- Composer ---------- */
html[data-page="hub"] .composer-wrap{padding:10px 28px 14px;background:var(--t-page)}
html[data-page="hub"] .composer{

}

   ================================================================== */

html[data-page] .mcp-actions button.primary:hover,

html[data-page] .form-actions .primary:hover{

/* 内页（技能 / 定时 / 画像 / 记忆 / 灵感）标题与工具条同一条基线 */

html[data-page="hub"] .group-head .group-add:hover{background:var(--t-sunken-2);color:var(--t-ink)}

/* ==================================================================
   19. 图表：JS 里写死的两个色值用 CSS 收回来
   ------------------------------------------------------------------
   admin.html 的 barChart() 把颜色当参数传（#378add / #1d9e75）。
   改 JS 要在三处同步，容易漏；而 CSS 的 fill 声明**优先于 SVG 的
   fill 表现属性**，所以在这里盖掉即可，两条曲线变成同一色相的两档。
   ================================================================== */
html[data-page="admin"] #chartMessages rect{fill:var(--t-accent)}
html[data-page="admin"] #chartUsers rect{fill:var(--t-accent-2)}
html[data-page="admin"] #chartMessages text,
html[data-page="admin"] #chartUsers text{fill:var(--t-faint);font-family:var(--t-mono);font-size:10px}
html[data-page="admin"] #chartMessages line,
html[data-page="admin"] #chartUsers line{stroke:var(--t-line)}

/* ==================================================================
   20. 深色模式（paper & ink 的夜间版）
   ------------------------------------------------------------------
   做法不是"再写一套页面"，而是把同一组令牌翻到暗面——五个页面里
   1.8 万行旧 CSS 都走 var()，翻令牌就跟着走。剩下写死浅色的地方
   在下面第二条规则里逐个收回。
   ================================================================== */
html[data-page][data-theme="dark"]{
  color-scheme:dark;
  --t-page:#131a1d;
  --t-surface:#192328;
  --t-rail:#0e1518;
  --t-paper:#111a1d;
  --t-sunken:#1c262b;
  --t-sunken-2:#243036;
  --t-line:#25333a;
  --t-line-2:#35464e;
  --t-ink:#e8eef0;
  --t-ink-2:#bcc9cf;
  --t-muted:#9aacb4;
  --t-faint:#8d9ea7;
  --t-accent:#54b6c0;
  --t-accent-deep:#79ccd5;
  --t-accent-2:#2e7d86;
  --t-on-accent:#0a1416;
  --t-accent-wash:rgba(84,182,192,.15);
  --t-accent-line:rgba(84,182,192,.45);
  --t-ok:#54c095;     --t-ok-wash:rgba(84,192,149,.14);
  --t-warn:#dcaa63;   --t-warn-wash:rgba(220,170,99,.14);
  --t-danger:#e28484; --t-danger-wash:rgba(226,132,132,.14);
  --t-sh-1:0 1px 2px rgba(0,0,0,.45);
  --t-sh-2:0 10px 22px -12px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.35);
  --t-sh-3:0 28px 64px -28px rgba(0,0,0,.85);
}
/* --bg / --panel 不在这里重设：admin 把这两者对调过，暗色下靠
   --t-page / --t-paper 翻转即可自动正确，重设反而会把那条特例盖掉。 */

/* 写死浅色的表面：顶栏、粘性筛选条、滚动条、选择高亮 */
html[data-page][data-theme="dark"] :where(.topbar,.top,header.top,.filters){
  background:rgba(17,26,29,.9) !important;
  border-color:var(--t-line) !important;
}
html[data-page][data-theme="dark"] ::-webkit-scrollbar-thumb{
  background:#33444b;background-clip:content-box}
html[data-page][data-theme="dark"] ::-webkit-scrollbar-thumb:hover{
  background:#43575f;background-clip:content-box}
html[data-page][data-theme="dark"] ::selection{
  background:rgba(84,182,192,.24);color:var(--t-ink)}
html[data-page][data-theme="dark"] .btn:hover{border-color:var(--t-line-2)}
/* 轻提示原本是"墨底白字"，夜里反过来了：改用暗面 + 亮字，靠一条线定形 */
html[data-page][data-theme="dark"] .toast{
  background:var(--t-surface);color:var(--t-ink);border:1px solid var(--t-line-2);
  box-shadow:var(--t-sh-3)}
html[data-page][data-theme="dark"] .toast.err{
  background:#3a1f1f;color:#f0b7b7;border-color:#5b2e2e}
/* 弹层遮罩在暗底上要更实一点，否则看不清层次 */
html[data-page][data-theme="dark"] :where(.modal,.scrim,.mine){background:rgba(6,10,12,.62)}

/* 消息平台里几处内联白底：返回按钮、选中的渠道行、开关轨道。

<script id="taste-theme">
/* 由 scripts/frontend/taste-layer.js 生成，勿手改 */
/* ==================================================================
   设计层脚本（taste-skill · paper & ink）
   ------------------------------------------------------------------
   只做三件事，不改任何业务逻辑：
     1. 尽早把 data-theme 落到 <html>（避免首帧白闪）；
     2. 往页头插一个主题切换按钮，选择记在 localStorage；
     3. 展示层收口：把裸露的 u_xxxx 换成昵称、把 default 租户说成人话。

   第 3 条是补丁，不是正解——正解是接口直接给 display_name / tenant_name。
   补丁集中在 tidyIdentity() 里，接口改了就能整段删掉。
   ================================================================== */
(function () {
  'use strict';

  var KEY = 'taste-theme';
  var root = document.documentElement;
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function readPref() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }
  function systemTheme() { return mq && mq.matches ? 'dark' : 'light'; }
  function resolve(pref) {
    return (pref === 'light' || pref === 'dark') ? pref : systemTheme();
  }
  function paint(pref) {
    var theme = resolve(pref);
    root.setAttribute('data-theme', theme);
    root.style.colorScheme = theme;
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1518' : '#f7f9fa');
  }

  // ---- 1. 首帧就定下来 ----
  var pref = readPref() || 'auto';
  paint(pref);

  if (mq) {
    var onSystem = function () { if ((readPref() || 'auto') === 'auto') paint('auto'); };
    if (mq.addEventListener) mq.addEventListener('change', onSystem);
    else if (mq.addListener) mq.addListener(onSystem);
  }

  // ---- 2. 切换按钮 ----
  var SUN = '<svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 3.2v2.1M12 18.7v2.1M3.2 12h2.1M18.7 12h2.1M5.9 5.9l1.5 1.5M16.6 16.6l1.5 1.5M18.1 5.9l-1.5 1.5M7.4 16.6l-1.5 1.5"/></svg>';
  var MOON = '<svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.4A8.2 8.2 0 0 1 9.6 4a8.6 8.6 0 1 0 10.4 10.4z"/></svg>';

  // 各页面的页头结构不一样，按优先级找第一个存在的落点。
  // admin 的 .who 是账号信息，按钮插到它前面；其它都是追加到动作区末尾。
  var SLOTS = [
    { sel: '#topActions', mode: 'append' },
    { sel: '.top-links', mode: 'append' },
    { sel: '.top-right', mode: 'append' },
    { sel: '#who', mode: 'before' },
    { sel: '.pane-head .actions', mode: 'append' },
    { sel: '.pane-head', mode: 'append' }
  ];

  function makeButton() {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'taste-theme-btn';
    btn.setAttribute('aria-label', '切换深浅色');
    btn.innerHTML = SUN + MOON;
    btn.addEventListener('click', function () {
      var next = resolve(readPref() || 'auto') === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(KEY, next); } catch (e) {}
      paint(next);
      sync();
    });
    return btn;
  }

  function sync() {
    var btn = document.querySelector('.taste-theme-btn');
    if (!btn) return;
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.title = dark ? '切换到浅色' : '切换到深色';
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }

  function mountButton() {
    if (document.querySelector('.taste-theme-btn')) { sync(); return; }
    for (var i = 0; i < SLOTS.length; i++) {
      var slot = document.querySelector(SLOTS[i].sel);
      if (!slot) continue;
      var btn = makeButton();
      if (SLOTS[i].mode === 'before') slot.parentNode.insertBefore(btn, slot);
      else slot.appendChild(btn);
      sync();
      return;
    }
  }

  // ---- 3. 展示层收口 ----
  var nameCache = null;

  function fetchName(cb) {
    if (nameCache !== null) return cb(nameCache);
    fetch('/api/me', { credentials: 'same-origin', headers: { Accept: 'application/json' } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (me) {
        nameCache = (me && me.display_name) || '';
        cb(nameCache);
      })
      .catch(function () { nameCache = ''; cb(''); });
  }

  // default 是内部租户标识，直接摆给用户看像是没填完的字段
  function humanTenant(text) {
    return text.replace(/(租户\s+|·\s*)default\b/g, '$1默认空间');
  }

  function tidyIdentity() {
    // 管理控制台页头：u_xxxxxxxx → 昵称
    var who = document.getElementById('who');
    if (who) {
      var mono = who.querySelector('.mono');
      if (mono && /^u_[0-9a-f]{10,}$/i.test(mono.textContent.trim())) {
        fetchName(function (name) {
          if (name) mono.textContent = name;
          else mono.textContent = mono.textContent.trim().slice(0, 6) + '…';
        });
      }
      var muted = who.querySelector('.muted');
      if (muted) muted.textContent = humanTenant(muted.textContent);
    }
    // 主界面侧栏：'成员 · default'
    var sub = document.getElementById('userSub');
    if (sub) {
      var t = humanTenant(sub.textContent);
      if (t !== sub.textContent) sub.textContent = t;
    }
  }

  function boot() {
    mountButton();
    tidyIdentity();
    // #who / #userSub 都是 JS 后填的，晚一拍再看一次
    setTimeout(tidyIdentity, 900);
    setTimeout(tidyIdentity, 2400);
    if (window.MutationObserver) {
      var pending = false;
      var mo = new MutationObserver(function () {
        if (pending) return;
        pending = true;
        requestAnimationFrame(function () { pending = false; tidyIdentity(); });
      });
      ['who', 'userSub'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) mo.observe(el, { childList: true, subtree: true, characterData: true });
      });
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
<!-- /taste-theme -->

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (path, opts = {}) => {
  const res = await fetch('/api' + path, {
    credentials: 'same-origin',
    headers: {'Content-Type': 'application/json', ...(opts.headers || {})},
    ...opts,
  });
  let body = {};
  try { body = await res.json(); } catch (e) { body = {}; }
  if (!res.ok) {
    const err = new Error(body.detail || ('请求失败 ' + res.status));
    err.status = res.status; err.body = body; throw err;
  }
  return body;
};
const toast = (msg, bad) => {
  const el = $('toast');
  el.textContent = msg;
  el.classList.toggle('bad', !!bad);
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2600);
};
const fmtTime = (iso) => {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = (n) => String(n).padStart(2, '0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};

const initialChannel = new URLSearchParams(location.search).get('channel');
const state = {
  selected: ['feishu', 'wecom', 'weixin'].includes(initialChannel) ? initialChannel : 'feishu',
  channels: [],
  detail: null,
  bots: [],
  dirty: false,
  gatewayAlive: false,
  enabled: true,
  loginTimer: null,
  loadTimer: null,
};

const MARKS = {
  feishu: {text: '飞', bg: 'linear-gradient(150deg,#5b8cff,#2f6bff)'},
  wecom: {text: '企', bg: 'linear-gradient(150deg,#3bb8ff,#0082d6)'},
  weixin: {text: '微', bg: 'linear-gradient(150deg,#4ed07a,#12a34a)'},
};
const POLICY_LABELS = {
  open: '允许所有人', allowlist: '仅白名单', pair: '配对批准', ignore: '静默丢弃', disabled: '关闭',
  mention: '仅 @ 时响应',
};

function dotClass(tone) {
  return tone === 'good' ? 'good' : tone === 'bad' ? 'bad' : tone === 'muted' ? 'muted' : 'warn';
}

function renderRail() {
  const list = $('channelList');
  list.innerHTML = state.channels.map(ch => {
    const mark = MARKS[ch.id] || {text: '?', bg: '#888'};
    return `<button class="ch-row ${ch.id === state.selected ? 'active' : ''}" data-id="${esc(ch.id)}">
      <div class="ch-mark" style="background:${mark.bg}">${mark.text}</div>
      <div class="ch-meta">
        <div class="ch-name">${esc(ch.name)}<span class="dot ${dotClass(ch.tone)}" title="${esc(ch.state_label)}"></span></div>
        <div class="ch-sub">${esc(ch.state_label)}</div>
      </div>
    </button>`;
  }).join('');
  list.querySelectorAll('.ch-row').forEach(row => {
    row.onclick = () => selectChannel(row.dataset.id);
  });
  $('channelCount').textContent = String(state.channels.length);
  const gw = $('gwDot');
  gw.className = 'dot ' + (state.gatewayAlive ? 'good' : 'bad');
  $('gwText').textContent = state.gatewayAlive ? '运行中' : '未运行';
}

function renderHeader() {
  const ch = state.detail;
  if (!ch) return;
  const mark = MARKS[ch.id] || {text: '?', bg: '#888'};
  const el = $('crumbMark');
  el.textContent = mark.text;
  el.style.background = mark.bg;
  $('crumbTitle').textContent = ch.name;
  $('crumbSub').textContent = ch.tagline;
  const chip = $('crumbChip');
  chip.textContent = ch.state_label;
  chip.className = 'chip ' + (ch.tone === 'good' ? 'ok' : ch.tone === 'bad' ? 'danger'
    : ch.tone === 'muted' ? '' : 'warn');
  $('enableToggle').checked = !!ch.enabled;
  $('enableToggle').disabled = !state.enabled;
  $('saveBtn').disabled = !state.enabled;
}

function renderCanvas() {
  const ch = state.detail;
  if (!ch) { $('canvas').innerHTML = '<div class="empty">加载中…</div>'; return; }
  const parts = [];

  if (!state.enabled) {
    parts.push(`<div class="banner bad"><svg class="ic"><use href="#i-shield"/></svg>
      <div><b>消息平台能力未开放</b>：部署配置里 <code>MESSAGING_ENABLED=false</code>。
      改成 true 后重启 API 与 Worker。</div></div>`);
  } else if (!state.gatewayAlive) {
    parts.push(`<div class="banner"><svg class="ic"><use href="#i-pulse"/></svg>
      <div><b>消息网关未运行</b>：渠道配置可以保存，但不会真正收发消息。
      启动执行器后才会生效：<code>python -m scripts.run_worker</code>。</div></div>`);
  } else if (ch.enabled && !ch.configured) {
    parts.push(`<div class="banner"><svg class="ic"><use href="#i-key"/></svg>
      <div><b>还缺少接入信息</b>：${esc(ch.missing.join('、'))}。配置保存后不会自动生效，
      需要重启 Worker（或点「重载」）。</div></div>`);
  } else if (ch.enabled && ch.state === 'pending_restart') {
    parts.push(`<div class="banner"><svg class="ic"><use href="#i-refresh"/></svg>
      <div><b>配置已保存，等待生效</b>：${esc(ch.reason || 'Worker 下一个节拍会重建连接')}。</div></div>`);
  }

  // 接入步骤 + 回调地址
  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-plug"/></svg>
      <div><div class="card-title">接入方式</div>
      <div class="card-sub">${ch.needs_public_url ? '需要公网 HTTPS 回调地址' : '长轮询，不需要公网地址'}</div></div>
      <div class="spacer"></div>
      ${ch.docs_url ? `<a class="btn sm ghost" href="${esc(ch.docs_url)}" target="_blank" rel="noreferrer">官方文档
        <svg class="ic sm"><use href="#i-external"/></svg></a>` : ''}
    </div>
    <div class="card-body">
      <div class="steps">${ch.setup_steps.map(s => `<div class="step">${esc(s)}</div>`).join('')}</div>
      ${ch.needs_public_url ? `
        <div class="callback">
          <code title="${esc(ch.callback_url || '尚未配置 IM_PUBLIC_BASE_URL')}">${esc(ch.callback_url || '尚未配置 IM_PUBLIC_BASE_URL')}</code>
          <button class="btn sm" id="copyCallback" ${ch.callback_url ? '' : 'disabled'}>复制</button>
        </div>` : ''}
    </div>
  </div>`);

  // 凭据
  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-key"/></svg>
      <div><div class="card-title">凭据</div>
      <div class="card-sub">${ch.id === 'weixin' ? '扫码后 token 自动保存；下面都是可选项' : '只从环境变量读取，界面不回显明文'}</div></div>
      <div class="spacer"></div>
      <span class="chip ${ch.configured ? 'ok' : 'warn'}">${ch.configured ? '已齐全' : '待配置'}</span>
    </div>
    <div class="card-body">
      ${ch.env.map(f => `<div class="field">
        <div class="f-main">
          <div class="f-label">${esc(f.label)} ${f.required ? '<span class="req">必填</span>' : '<span class="chip">可选</span>'}</div>
          ${f.help ? `<div class="f-help">${esc(f.help)}</div>` : ''}
          <div class="f-env mono">${esc(f.env)}${f.preview ? ' · ' + esc(f.preview) : ''}</div>
        </div>
        <div class="f-side">
          <span class="chip ${f.is_set ? 'ok' : (f.required ? 'danger' : '')}">${f.is_set ? '已配置' : '未配置'}</span>
        </div>
      </div>`).join('')}
      <div class="hint">改 <code>.env</code> 后需要重启 Worker 才会生效。不要把密钥贴进聊天或截图。</div>
    </div>
  </div>`);

  // 个人微信：扫码登录
  if (ch.id === 'weixin') {
    parts.push(`<div class="card">
      <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-pulse"/></svg>
        <div><div class="card-title">扫码登录</div>
        <div class="card-sub">iLink bot 身份，不是本人微信号；群聊基本收不到</div></div>
        <div class="spacer"></div>
        <span class="chip ${ch.login && ch.login.logged_in ? 'ok' : 'warn'}" id="loginChip">
          ${ch.login && ch.login.logged_in ? '已登录' : '未登录'}</span>
      </div>
      <div class="card-body">
        <div class="qr-wrap">
          <div class="qr-box" id="qrBox">
            ${ch.login && ch.login.logged_in
              ? `<div class="qr-empty">已登录<br><span class="mono">${esc(ch.login.account_id || '')}</span></div>`
              : `<div class="qr-empty">点「扫码登录」<br>用微信扫描二维码</div>`}
          </div>
          <div class="qr-side">
            <div class="qr-status"><span class="dot ${ch.login && ch.login.logged_in ? 'good' : 'muted'}" id="loginDot"></span>
              <span id="loginStatus">${ch.login && ch.login.logged_in ? '连接凭据已保存' : '尚未登录'}</span></div>
            <div class="qr-note" id="loginNote">
              ${ch.login && ch.login.logged_in
                ? 'Worker 下一次同步会建立长轮询。会话过期（errcode=-14）时需要重新扫码。'
                : '扫码成功后会自动保存 token；不需要公网地址。'}
            </div>
            <div class="qr-meta mono" id="loginMeta"></div>
            <div class="form-actions" style="justify-content:flex-start">
              <button class="btn primary" id="qrStart">扫码登录</button>
              <button class="btn ghost" id="qrCancel" hidden>取消</button>
              <button class="btn danger" id="qrLogout" ${ch.login && ch.login.logged_in ? '' : 'hidden'}>退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </div>`);
  }

  // 行为
  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-bot"/></svg>
      <div><div class="card-title">行为</div>
      <div class="card-sub">绑定的机器人决定人设、技能与记忆；授权默认拒绝</div></div>
    </div>
    <div class="card-body">
      <div class="form-grid">
        <label class="full"><span class="lbl">绑定机器人</span>
          <select class="input" id="fBot">
            <option value="">不绑定（通用助手）</option>
            ${state.bots.map(b => `<option value="${esc(b.bot_id)}" ${ch.bot_id === b.bot_id ? 'selected' : ''}>
              ${esc(b.name)}${b.handle ? ' @' + esc(b.handle) : ''}</option>`).join('')}
          </select>
          <div class="hint">每个 IM 会话一条独立 Agent 会话；机器人能力（人设/技能/连接器）会带进来。</div>
        </label>
        <label><span class="lbl">私聊策略</span>
          <select class="input" id="fDm">
            ${ch.dm_policies.map(p => `<option value="${esc(p)}" ${ch.dm_policy === p ? 'selected' : ''}>
              ${esc(POLICY_LABELS[p] || p)}</option>`).join('')}
          </select>
        </label>
        <label><span class="lbl">群聊策略</span>
          <select class="input" id="fGroup">
            ${ch.group_policies.map(p => `<option value="${esc(p)}" ${ch.group_policy === p ? 'selected' : ''}>
              ${esc(POLICY_LABELS[p] || p)}</option>`).join('')}
          </select>
          ${ch.capabilities.group ? '' : '<div class="hint">该渠道不支持群聊。</div>'}
        </label>
        <label class="full"><span class="lbl">用户白名单（逗号或换行分隔，<code>*</code> 表示全部）</span>
          <textarea class="input" id="fAllow" placeholder="例如：ou_xxx, ou_yyy">${esc((ch.allowed_users || []).join('\n'))}</textarea>
          <div class="hint">未在白名单里的私聊会收到配对码，批准后才放行；群聊不发配对码。</div>
        </label>
        ${ch.options.map(opt => `<label class="${opt.kind === 'switch' ? '' : ''}">
          ${opt.kind === 'select'
            ? `<span class="lbl">${esc(opt.label)}</span><select class="input" data-opt="${esc(opt.key)}">
                 ${opt.choices.map(c => `<option value="${esc(c.value)}" ${opt.value === c.value ? 'selected' : ''}>${esc(c.label)}</option>`).join('')}
               </select>`
            : `<span class="lbl">${esc(opt.label)}</span><input class="input" data-opt="${esc(opt.key)}" value="${esc(opt.value || '')}" placeholder="${esc(opt.help || '')}">`}
          ${opt.help ? `<div class="hint">${esc(opt.help)}</div>` : ''}
        </label>`).join('')}
      </div>
      <div class="form-actions">
        <button class="btn" id="testBtn">发送测试消息</button>
        <button class="btn primary" id="saveBtn2">保存配置</button>
      </div>
    </div>
  </div>`);

  // 状态 + 配对 + 事件
  const rt = ch.runtime || {};
  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-pulse"/></svg>
      <div><div class="card-title">运行状态</div>
      <div class="card-sub">由 Worker 写入，API 只读</div></div>
      <div class="spacer"></div>
      <span class="chip ${ch.tone === 'good' ? 'ok' : ch.tone === 'bad' ? 'danger' : 'warn'}">${esc(ch.state_label)}</span>
    </div>
    <div class="card-body">
      <dl class="kv">
        <dt>状态</dt><dd>${esc(ch.state)}${ch.reason ? ' · ' + esc(ch.reason) : ''}</dd>
        <dt>最近更新</dt><dd>${esc(fmtTime(rt.updated_at))}</dd>
        <dt>Worker</dt><dd class="mono">${esc(rt.worker_id || '—')}</dd>
        <dt>待处理</dt><dd>入站 ${esc((ch.backlog || {}).inbox ?? 0)} · 出站 ${esc((ch.backlog || {}).outbox ?? 0)}</dd>
      </dl>
    </div>
  </div>`);

  const pair = ch.pairing || {pending: [], approved: []};
  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-users"/></svg>
      <div><div class="card-title">配对请求</div>
      <div class="card-sub">陌生人在私聊里会收到 8 位配对码；批准后才允许驱动 Agent</div></div>
      <div class="spacer"></div>
      <span class="chip ${pair.pending.length ? 'warn' : ''}">待批 ${pair.pending.length}</span>
    </div>
    <div class="card-body">
      <div class="pair-form">
        <input class="input" id="pairCode" maxlength="16" inputmode="numeric" placeholder="输入 8 位配对码">
        <button class="btn" id="pairApprove">批准</button>
      </div>
      <div style="margin-top:10px">
        ${pair.pending.length ? pair.pending.map(p => `<div class="pair-row">
          <span class="chip warn">${esc(p.platform)}</span>
          <div class="who">${esc(p.user_id)}<small>${esc(p.chat_id)} · ${p.expires_in > 0 ? Math.ceil(p.expires_in/60) + ' 分钟内有效' : '已过期'}</small></div>
        </div>`).join('') : '<div class="empty">没有待批请求。</div>'}
      </div>
      ${pair.approved.length ? `<div style="margin-top:14px">
        <div class="lbl">已批准</div>
        ${pair.approved.map(p => `<div class="pair-row">
          <span class="chip ok">${esc(p.platform)}</span>
          <div class="who">${esc(p.user_id)}<small>${esc(p.chat_id)}</small></div>
          <button class="btn sm danger" data-revoke="${esc(p.platform)}|${esc(p.user_id)}">撤销</button>
        </div>`).join('')}
      </div>` : ''}
    </div>
  </div>`);

  parts.push(`<div class="card">
    <div class="card-head"><svg class="ic" style="color:var(--muted)"><use href="#i-clock"/></svg>
      <div><div class="card-title">最近事件</div>
      <div class="card-sub">只记状态与哈希，不保存消息正文</div></div>
    </div>
    <div class="card-body">
      ${(ch.events || []).length ? `<table class="events"><thead><tr>
        <th>时间</th><th>方向</th><th>状态</th><th>会话</th><th>消息</th>
      </tr></thead><tbody>
        ${ch.events.map(e => `<tr>
          <td>${esc(fmtTime(e.created_at))}</td>
          <td>${e.direction === 'out' ? '出站' : '入站'}</td>
          <td>${esc(e.status)}${e.error_code ? ' · ' + esc(e.error_code) : ''}</td>
          <td class="mono">${esc(e.chat_id_hash || '—')}</td>
          <td class="mono">${esc((e.message_id || '—').slice(0, 22))}</td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty">还没有事件。收到第一条消息后会出现在这里。</div>'}
    </div>
  </div>`);

  $('canvas').innerHTML = parts.join('');
  bindCanvas();
}

function bindCanvas() {
  const ch = state.detail;
  const copy = $('copyCallback');
  if (copy) copy.onclick = async () => {
    try { await navigator.clipboard.writeText(ch.callback_url); toast('回调地址已复制'); }
    catch (e) { toast('复制失败，请手动选择', true); }
  };
  const save2 = $('saveBtn2');
  if (save2) save2.onclick = saveConfig;
  const test = $('testBtn');
  if (test) test.onclick = testSend;
  const pairBtn = $('pairApprove');
  if (pairBtn) pairBtn.onclick = approvePairing;
  document.querySelectorAll('[data-revoke]').forEach(btn => {
    btn.onclick = () => revokePairing(btn.dataset.revoke);
  });
  const qrStart = $('qrStart');
  if (qrStart) qrStart.onclick = startWeixinLogin;
  const qrCancel = $('qrCancel');
  if (qrCancel) qrCancel.onclick = cancelWeixinLogin;
  const qrLogout = $('qrLogout');
  if (qrLogout) qrLogout.onclick = logoutWeixin;
  document.querySelectorAll('#fBot,#fDm,#fGroup,#fAllow,[data-opt]').forEach(el => {
    el.addEventListener('input', () => { state.dirty = true; });
    el.addEventListener('change', () => { state.dirty = true; });
  });
}

function collectFields() {
  const ch = state.detail;
  const options = {};
  document.querySelectorAll('[data-opt]').forEach(el => { options[el.dataset.opt] = el.value; });
  const allow = $('fAllow');
  return {
    bot_id: ($('fBot') || {}).value || '',
    dm_policy: ($('fDm') || {}).value || ch.dm_policy,
    group_policy: ($('fGroup') || {}).value || ch.group_policy,
    allowed_users: allow ? allow.value.split(/[\n,，]/).map(s => s.trim()).filter(Boolean) : ch.allowed_users,
    options,
  };
}

async function saveConfig() {
  const ch = state.detail;
  try {
    const body = collectFields();
    const updated = await api(`/messaging/channels/${ch.id}`, {method: 'PUT', body: JSON.stringify(body)});
    state.detail = updated;
    state.dirty = false;
    renderHeader(); renderCanvas();
    toast('配置已保存；Worker 下一个节拍会按需重建连接');
    await loadList();
  } catch (e) { toast(e.message, true); }
}

async function toggleEnabled() {
  const ch = state.detail;
  const next = $('enableToggle').checked;
  try {
    const updated = await api(`/messaging/channels/${ch.id}`, {
      method: 'PUT', body: JSON.stringify({enabled: next}),
    });
    state.detail = updated;
    renderHeader(); renderCanvas();
    toast(next ? '已启用；如果是凭据问题，状态会显示待配置' : '已停用');
    await loadList();
  } catch (e) {
    $('enableToggle').checked = !next;
    toast(e.message, true);
  }
}

async function reloadChannel() {
  try {
    await api(`/messaging/channels/${state.detail.id}/reload`, {method: 'POST'});
    toast('已请求 Worker 重建连接');
    setTimeout(() => loadDetail(), 1200);
  } catch (e) { toast(e.message, true); }
}

async function testSend() {
  const ch = state.detail;
  const opt = (ch.options || []).find(o => o.key === 'home_chat_id');
  const current = document.querySelector('[data-opt="home_chat_id"]');
  const target = (current && current.value || (opt && opt.value) || '').trim();
  if (!target) { toast('先在「默认会话 ID」里填一个目标，再发送测试', true); return; }
  try {
    await api(`/messaging/channels/${ch.id}/test`, {
      method: 'POST', body: JSON.stringify({chat_id: target}),
    });
    toast('测试消息已进入出站队列，几秒内会发出');
  } catch (e) { toast(e.message, true); }
}

async function approvePairing() {
  const code = ($('pairCode').value || '').trim();
  if (!code) { toast('请输入配对码', true); return; }
  try {
    await api('/messaging/pairing/approve', {
      method: 'POST', body: JSON.stringify({code}),
    });
    toast('已批准，已通知对方');
    await loadDetail();
  } catch (e) { toast(e.message, true); }
}

async function revokePairing(encoded) {
  const [platform, ...rest] = encoded.split('|');
  const user_id = rest.join('|');
  if (!confirm(`撤销 ${platform} 用户 ${user_id} 的授权？`)) return;
  try {
    await api('/messaging/pairing/revoke', {
      method: 'POST', body: JSON.stringify({platform, user_id}),
    });
    toast('已撤销');
    await loadDetail();
  } catch (e) { toast(e.message, true); }
}

/* ---------------- 个人微信扫码 ---------------- */

function stopLoginPoll() {
  clearInterval(state.loginTimer);
  state.loginTimer = null;
  const cancel = $('qrCancel');
  if (cancel) cancel.hidden = true;
}

function paintLogin(view) {
  const box = $('qrBox');
  const status = $('loginStatus');
  const note = $('loginNote');
  const dot = $('loginDot');
  const chip = $('loginChip');
  if (!box) return;
  const map = {wait: '等待扫码', scaned: '已扫码，等待确认', confirmed: '登录成功',
               expired: '二维码已过期', error: '登录失败', idle: '尚未登录', starting: '正在获取二维码'};
  if (status) status.textContent = map[view.status] || view.status || '';
  if (dot) dot.className = 'dot ' + (view.status === 'confirmed' ? 'good'
    : ['wait','scaned'].includes(view.status) ? 'warn' : 'muted');
  if (chip) { chip.textContent = view.status === 'confirmed' ? '已登录' : '未登录';
    chip.className = 'chip ' + (view.status === 'confirmed' ? 'ok' : 'warn'); }
  if (note) note.textContent = view.message || '';
  if (box && view.qr_svg) {
    box.innerHTML = `<img alt="微信登录二维码" src="${view.qr_svg}">`;
  }
}

async function startWeixinLogin() {
  try {
    const view = await api('/messaging/channels/weixin/login/start', {method: 'POST'});
    paintLogin(view);
    $('qrCancel').hidden = false;
    $('qrLogout').hidden = true;
    toast('二维码已生成，请用微信扫码');
    stopLoginPoll();
    state.loginTimer = setInterval(pollLogin, 1800);
  } catch (e) { toast(e.message, true); }
}

async function pollLogin() {
  try {
    const view = await api('/messaging/channels/weixin/login/status');
    paintLogin(view);
    if (view.status === 'confirmed') {
      stopLoginPoll();
      toast('个人微信登录成功');
      await loadList();
      await loadDetail();
    } else if (['expired', 'error', 'cancelled', 'idle'].includes(view.status)) {
      stopLoginPoll();
      if (view.status === 'expired') toast('二维码过期，请重新发起登录', true);
    }
  } catch (e) { /* 轮询失败安静重试 */ }
}

async function cancelWeixinLogin() {
  try { await api('/messaging/channels/weixin/login/cancel', {method: 'POST'}); }
  catch (e) { /* ignore */ }
  stopLoginPoll();
  paintLogin({status: 'idle', message: '已取消'});
}

async function logoutWeixin() {
  if (!confirm('退出个人微信登录？Worker 会停止这个渠道。')) return;
  try {
    await api('/messaging/channels/weixin/login/logout', {method: 'POST'});
    stopLoginPoll();
    toast('已退出登录');
    await loadDetail();
    await loadList();
  } catch (e) { toast(e.message, true); }
}

/* ---------------- 加载 ---------------- */

async function loadList() {
  try {
    const data = await api('/messaging/channels');
    state.channels = data.channels || [];
    state.gatewayAlive = !!data.gateway_alive;
    state.enabled = data.enabled !== false;
    renderRail();
    renderHeader();
  } catch (e) {
    toast(e.message, true);
  }
}

async function loadDetail() {
  try {
    const data = await api(`/messaging/channels/${state.selected}`);
    state.detail = data;
    state.dirty = false;
    renderHeader();
    renderCanvas();
    if (data.id === 'weixin' && !data.login?.logged_in) {
      const view = await api('/messaging/channels/weixin/login/status').catch(() => null);
      if (view) paintLogin(view);
    }
  } catch (e) {
    $('canvas').innerHTML = `<div class="banner bad"><svg class="ic"><use href="#i-shield"/></svg>
      <div>加载失败：${esc(e.message)}</div></div>`;
  }
}

async function selectChannel(id) {
  if (state.dirty && !confirm('当前配置还没保存，切换渠道会丢弃修改。继续？')) return;
  state.selected = id;
  const url = new URL(location.href);
  url.searchParams.set('channel', id);
  history.replaceState(null, '', url);
  stopLoginPoll();
  renderRail();
  state.detail = null;
  $('canvas').innerHTML = '<div class="empty">加载中…</div>';
  await loadDetail();
}

async function loadBots() {
  try {
    const data = await api('/bots');
    state.bots = data.bots || [];
  } catch (e) { state.bots = []; }
}

async function boot() {
  await loadBots();
  await loadList();
  await loadDetail();
  $('backToChat').onclick = () => { window.location.href = '/'; };
  $('refreshAll').onclick = async () => { await loadList(); await loadDetail(); toast('已刷新'); };
  $('enableToggle').onchange = toggleEnabled;
  $('reloadBtn').onclick = reloadChannel;
  $('saveBtn').onclick = saveConfig;
  state.loadTimer = setInterval(async () => {
    if (!state.dirty && !document.hidden) {
      await loadList();
      await loadDetail();
    }
  }, 6000);
}

boot();
</script>
