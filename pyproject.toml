[project]
name = "webpage-agent"
version = "0.1.0"
description = "智能体中台：Pi 执行内核 + PostgreSQL 持久化"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"webpage_agent.api" = ["web/*.html"]

[tool.ruff]
target-version = "py312"
src = ["src"]
exclude = ["openmontage-zh-mcp", "artifacts", "profile", "secrets"]

[tool.ruff.lint]
# Correctness checks across existing code; style changes are deliberately separate.
select = ["E9", "F"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = [
    "src/webpage_agent/observe/telemetry.py",
    "src/webpage_agent/store/migrations.py",
    "scripts/package_release.py",
    "src/webpage_agent/governance",
    "src/webpage_agent/tools/tool_policy.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
