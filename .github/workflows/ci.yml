name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: agent_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      APP_ENV: test
      AUTH_MODE: 'off'
      DB_AUTO_MIGRATE: 'true'
      API_RATE_LIMIT_ENABLED: 'false'
      TENANT_BUDGET_ENABLED: 'false'
      PG_TEST_DSN: postgresql://postgres:test-only-password@localhost:5432/agent_test
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/agent_test
      MCP_SERVERS: '[]'
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt -r requirements-dev.txt
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pi runtime typecheck, tests, and schema golden
        working-directory: pi-runtime
        run: npm ci && npm run check
      - run: python -m ruff check src scripts tests
      - run: python -m mypy
      - run: python -W error::RuntimeWarning -m unittest discover -s tests -t . -v
      - run: python -m scripts.package_release
      - name: Test the clean release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/source-release"
          tar -xzf dist/webpage-agent.tar.gz -C "$RUNNER_TEMP/source-release"
          cd "$RUNNER_TEMP/source-release"
          sha256sum -c SHA256SUMS
          python -W error::RuntimeWarning -m unittest discover -s tests -t . -v
