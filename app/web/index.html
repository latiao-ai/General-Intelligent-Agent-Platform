<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页研究与 HTML 报告</title>
<style>
:root{--bg:#f5f6f8;--fg:#1b2430;--muted:#6b7684;--line:#e2e6eb;--accent:#165eb4;
      --user:#d9ecff;--card:#fff;--warn:#fff6df}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 140px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.head button{flex:0 0 auto}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;margin-bottom:12px}
.msg{display:flex;margin-bottom:10px}
.msg .bubble{max-width:76%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;
             overflow-wrap:anywhere}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user)}
.msg.assistant .bubble{background:var(--card);border:1px solid var(--line)}
#process .row{display:flex;gap:8px;align-items:flex-start;padding:3px 0;
              overflow-wrap:anywhere}
#process .ico{flex:0 0 18px;text-align:center}
.thought{color:#3b4757;font-style:normal}
.detail{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);
     border-top:1px solid var(--line);padding:12px 16px}
.bar .inner{max-width:860px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;height:46px;padding:11px 12px;border:1px solid var(--line);
         border-radius:9px;font:inherit;outline:none}
textarea:focus{border-color:var(--accent)}
button{padding:0 18px;height:46px;border:0;border-radius:9px;background:var(--accent);
       color:#fff;font:inherit;cursor:pointer;white-space:nowrap}
button.ghost{background:#eef1f5;color:#2a3442}
button.warn{background:#c0392b}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:9px;
      background:#eef1f5;color:#2a3442;text-decoration:none}
.ok{background:#e8f6ec;border:1px solid #b7e0c4;padding:10px 14px;border-radius:9px;
    margin-top:8px;overflow-wrap:anywhere}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left}
th{background:#f0f3f7}
details summary{cursor:pointer;color:var(--muted);font-size:13px}
.err{color:#c0392b}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>网页研究与 HTML 报告</h1>
      <div class="sub">
        输入主题或链接，智能体会实时展示执行过程与各阶段耗时。
        <b>运行中再发一条消息会自动打断当前任务</b>，带着上文改方向，不必先点停止。
      </div>
    </div>
    <button id="newSession" class="ghost" style="height:34px">新对话</button>
  </div>

  <div id="messages"></div>

  <div class="card" id="processCard">
    <div class="hint" id="processTitle">智能体执行过程（尚无动作）</div>
    <div id="process"></div>
  </div>

  <div class="card" id="stagesCard">
    <div class="hint">阶段耗时<span id="total">（尚未开始）</span></div>
    <div class="hint" id="latency"></div>
    <table>
      <thead><tr><th style="width:38%">阶段</th><th style="width:22%">耗时(秒)</th><th>状态</th></tr></thead>
      <tbody id="stages"></tbody>
    </table>
  </div>

  <div id="result"></div>
</div>

<div class="bar"><div class="inner">
  <textarea id="msg" placeholder="例如：整理 SQLite 的适用场景和限制，生成中文报告。生成后要发布就说「…然后部署到服务器」"></textarea>
  <button id="stop" class="warn" style="display:none">停止</button>
  <button id="send">发送</button>
</div></div>

<script>
const S = { sessionId: null, taskId: null, artifactId: null, es: null,
            running: false, status: null, stages: [], stageSeq: 0, skew: 0 };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $('messages').appendChild(el);
  el.scrollIntoView({block: 'end', behavior: 'smooth'});
}

function addEvent(ev) {
  const row = document.createElement('div');
  row.className = 'row';
  if (ev.type === 'thought') {
    row.innerHTML = `<div class="ico">💭</div><div class="thought">${esc(ev.text)}</div>`;
  } else if (ev.type === 'action') {
    const detail = ev.detail ? `<span class="detail">：${esc(ev.detail)}</span>` : '';
    row.innerHTML = `<div class="ico">${esc(ev.icon || '•')}</div>` +
                    `<div>${esc(ev.label)}${detail}</div>`;
  } else { return; }
  $('process').appendChild(row);
  $('processTitle').textContent = '智能体执行过程';
  row.scrollIntoView({block: 'end', behavior: 'smooth'});
}

// ---------- 阶段耗时（进行中实时累加） ----------

function elapsedOf(st) {
  if (st.done) return st.seconds;
  // 用服务端给的开始时刻来算：事件经网络/轮询到达会晚几十到几百毫秒，
  // 若按"本地收到时刻"计时会偏短。skew 用来校正本机与服务端的时钟差。
  return Math.max(0, (Date.now() / 1000 - S.skew) - st.at);
}

function onStageStart(ev) {
  if (!S.stages.length) S.skew = Date.now() / 1000 - ev.at;
  S.stages.push({ id: ++S.stageSeq, stage: ev.stage, label: ev.label || ev.stage,
                  at: ev.at, done: false, seconds: null, status: '' });
  renderStages();
}

function onStageEnd(ev) {
  // 补搜会让同一个 stage 出现多次，所以从后往前关闭最后一个未完成项。
  for (let i = S.stages.length - 1; i >= 0; i--) {
    const st = S.stages[i];
    if (st.stage === ev.stage && !st.done) {
      st.done = true;
      st.seconds = ev.seconds;
      st.status = ev.status || '完成';
      break;
    }
  }
  renderStages();
}

function updateTotal() {
  // 只累加真实阶段；"收到指令→开始搜索"跨越了解析需求，算进去会重复计数。
  const total = S.stages
    .filter(st => st.stage !== 'instruction')
    .reduce((sum, st) => sum + elapsedOf(st), 0);
  $('total').textContent = S.stages.length
    ? `（合计 ${total.toFixed(2)} 秒）` : '（尚未开始）';
}

// 「收到指令 → 开始搜索」单独放在表头那行：它跨越了解析需求，
// 混在阶段表里会让人以为是一个独立的、需要相加的阶段。
function renderLatency() {
  const st = S.stages.find(item => item.stage === 'instruction');
  $('latency').textContent = st
    ? `从发出指令到开始搜索：${elapsedOf(st).toFixed(2)} 秒`
      + (st.done ? '' : '（进行中…）')
    : '';
}

function renderStages() {
  const rows = S.stages.filter(st => st.stage !== 'instruction');
  $('stages').innerHTML = rows.map(st => `
    <tr data-id="${st.id}">
      <td>${esc(st.label)}</td>
      <td class="sec">${elapsedOf(st).toFixed(2)}</td>
      <td>${st.done ? esc(st.status) : '<b>进行中…</b>'}</td>
    </tr>`).join('');
  updateTotal();
  renderLatency();
}

// 兜底：任务进入终态时关掉所有还开着的阶段行。后端取消时也会补发 stage_end，
// 这里再兜一层，避免那一行永远停在"进行中"、耗时一路涨下去。
function closeOpenStages(status) {
  const label = status === 'cancelled' ? '已中断'
              : status === 'failed' ? '已失败' : '已结束';
  let changed = false;
  for (const st of S.stages) {
    if (st.done) continue;
    st.done = true;
    st.seconds = elapsedOf(st);
    st.status = label;
    changed = true;
  }
  if (changed) renderStages();
}

// 只刷"进行中"那一格，100ms 一次 —— 这就是实时增长的部分。
setInterval(() => {
  let ticking = false;
  for (const st of S.stages) {
    if (st.done) continue;
    ticking = true;
    if (st.stage === 'instruction') continue;   // 渲染在表头那行
    const cell = document.querySelector(`#stages tr[data-id="${st.id}"] .sec`);
    if (cell) cell.textContent = elapsedOf(st).toFixed(2);
  }
  if (ticking) { updateTotal(); renderLatency(); }
}, 100);

function resetProcess() {
  $('process').innerHTML = '';
  $('processTitle').textContent = '智能体执行过程（尚无动作）';
  $('result').innerHTML = '';
  S.stages = [];
  renderStages();
}

function setRunning(on) {
  S.running = on;
  // 运行中依然可以发送：发送会自动打断当前任务并开启新一轮，不必先点停止。
  $('send').disabled = false;
  $('send').textContent = on ? '打断并发送' : '发送';
  $('stop').style.display = on ? '' : 'none';
  if (on) $('processTitle').textContent = '智能体执行过程（进行中）';
}

// 打断当前任务：取消它，并等它的结束提示经原事件流渲染出来后再继续，
// 这样"上一轮被中断"的提示不会丢，也避免两条任务的日志混在一起。
async function interrupt() {
  if (!S.taskId || !S.running) return;
  const stream = S.es;
  try {
    await fetch(`/api/tasks/${S.taskId}/cancel`, {method: 'POST'});
  } catch { /* 取消失败也让新一轮继续 */ }
  const deadline = Date.now() + 2000;
  while (S.running && Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 50));
  }
  if (S.es === stream) { S.es.close(); S.es = null; }
  S.running = false;
}

async function send() {
  const text = $('msg').value.trim();
  if (!text) return;
  $('msg').value = '';
  // 正在运行时直接打断改方向，不要求用户先点停止
  if (S.running) await interrupt();
  addMessage('user', text);
  resetProcess();
  setRunning(true);
  $('send').disabled = true;          // 提交期间短暂禁用，避免连点起两个任务
  try {
    const res = await fetch('/api/tasks', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: S.sessionId}),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    S.sessionId = data.session_id;
    S.taskId = data.task_id;
    S.status = null;
    openStream(S.taskId);
  } catch (err) {
    addMessage('assistant', '提交失败：' + err.message);
    setRunning(false);
  } finally {
    $('send').disabled = false;
  }
}

function openStream(taskId) {
  if (S.es) S.es.close();
  const es = new EventSource(`/api/tasks/${taskId}/events`);
  S.es = es;
  es.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'task') { S.artifactId = ev.artifact_id; return; }
    if (ev.type === 'stage_start') { onStageStart(ev); return; }
    if (ev.type === 'stage_end') { onStageEnd(ev); return; }
    if (ev.type === 'result') { showDeployed(ev.public_url, ev.deployment_id); return; }
    if (ev.type === 'status') {
      if (ev.detail) addMessage('assistant', ev.detail);
      finish(ev.status);
      return;
    }
    if (ev.type === 'end') { finish(ev.status); return; }
    addEvent(ev);
  };
  es.onerror = () => { /* 断线由浏览器自动重连；服务端在任务结束时会正常关闭 */ };
}

async function finish(status) {
  if (!S.running && S.status === status) return;
  S.status = status;
  setRunning(false);
  if (S.es) { S.es.close(); S.es = null; }
  closeOpenStages(status);
  if (!S.taskId) return;
  try {
    const res = await fetch(`/api/tasks/${S.taskId}`);
    const data = await res.json();
    renderResult(data.state);
  } catch { /* 结果区拿不到不影响主流程 */ }
}

function renderResult(state) {
  if (!state) return;
  const box = $('result');
  box.innerHTML = '';
  const deployment = state.deployment || {};

  if (state.artifact || S.artifactId) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<b>报告产物</b><div class="actions"></div>';
    const actions = card.querySelector('.actions');
    if (S.artifactId) {
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = `/api/tasks/${S.taskId}/artifact`;
      a.target = '_blank';
      a.textContent = '打开 / 下载 HTML';
      actions.appendChild(a);
    }
    if (deployment.status !== 'success') {
      const btn = document.createElement('button');
      btn.textContent = '部署到服务器';
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '部署中…';
        try {
          const res = await fetch(`/api/tasks/${S.taskId}/deploy`, {method: 'POST'});
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
          showDeployed(data.public_url, data.deployment_id);
        } catch (err) {
          btn.disabled = false; btn.textContent = '部署到服务器';
          box.insertAdjacentHTML('beforeend',
            `<div class="card err">部署失败：${esc(err.message)}</div>`);
        }
      };
      actions.appendChild(btn);
    }
    box.appendChild(card);
  }

  if (deployment.public_url) showDeployed(deployment.public_url, deployment.deployment_id);
}

function showDeployed(url, siteId) {
  const box = $('result');
  box.insertAdjacentHTML('afterbegin',
    `<div class="card ok">已部署：<a href="${esc(url)}" target="_blank">${esc(url)}</a>` +
    (siteId ? `<div class="hint">站点 ID：${esc(siteId)}</div>` : '') + '</div>');
}

async function stop() {
  if (!S.taskId || !S.running) return;
  $('stop').disabled = true;
  try { await fetch(`/api/tasks/${S.taskId}/cancel`, {method: 'POST'}); }
  finally { $('stop').disabled = false; }
}

$('send').onclick = send;
$('stop').onclick = stop;
// 不做任何持久化恢复：每次打开页面都是干净的新会话。
// （会话与任务在服务端 SQLite 里仍然保留，需要时可经 API 查询。）
$('newSession').onclick = async () => {
  if (S.running) await interrupt();
  $('messages').innerHTML = '';
  $('result').innerHTML = '';
  resetProcess();
  setRunning(false);
  S.sessionId = null;
  S.taskId = null;
  S.status = null;
};
$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
