<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>网页研究与 HTML 报告</title>
<style>
:root{--bg:#f5f6f8;--fg:#1b2430;--muted:#6b7684;--line:#e2e6eb;--accent:#165eb4;
      --user:#d9ecff;--card:#fff;--warn:#fff6df}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
     font:15px/1.7 system-ui,-apple-system,"PingFang SC",sans-serif;
     display:flex;flex-direction:column;overflow:hidden}

/* 左栏 + 主区 */
.app{display:flex;flex:1;min-height:0}
.sidebar{width:264px;flex:0 0 264px;background:var(--card);
  border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:14px 12px}
.sidebar button.full{width:100%;margin-bottom:12px}
.sidebar .side-label{color:var(--muted);font-size:12px;margin:4px 2px 8px}
.session-list{flex:1;overflow-y:auto}
.session-item{padding:9px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px;
  border:1px solid transparent}
.session-item:hover{background:#f0f3f7}
.session-item.active{background:var(--user);border-color:#bcd7f2}
.session-item .t{font-size:14px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;line-height:1.4}
.session-item .m{font-size:12px;color:var(--muted)}
.content{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;padding:20px 18px 12px}

h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
      padding:14px 16px;margin-bottom:12px}
.msg{display:flex;margin-bottom:10px}
.msg .bubble{max-width:76%;padding:10px 14px;border-radius:12px;white-space:pre-wrap;
             overflow-wrap:anywhere}
.msg.user{justify-content:flex-end}
.msg.user .bubble{background:var(--user)}
.msg.assistant .bubble{background:var(--card);border:1px solid var(--line)}
#process .row{display:flex;gap:8px;align-items:flex-start;padding:3px 0;
               overflow-wrap:anywhere}
#process .ico{flex:0 0 18px;text-align:center}
.thought{color:#3b4757;font-style:normal}
.detail{color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
#process .stage-row{display:flex;gap:8px;align-items:flex-start;padding:4px 0;
                    margin-top:2px}
#process .stage-row .stage-ico{flex:0 0 18px;text-align:center;font-size:13px}
#process .stage-row .stage-text{font-size:14px}
#process .stage-row .stage-sec{font-size:12px;color:var(--muted);
  font-variant-numeric:tabular-nums;margin-left:auto;padding:0 2px;
  white-space:nowrap;flex:0 0 auto;min-width:72px;text-align:right;
  font-family:ui-monospace,monospace}
#process .stage-row .stage-sec b{color:var(--fg);font-weight:600}
#process .turn{margin-bottom:14px}
#process .turn-head{display:flex;align-items:center;gap:8px;color:var(--muted);
  font-size:12px;margin:2px 0 6px;white-space:nowrap}
#process .turn-head::after{content:"";flex:1;height:1px;background:var(--line)}
#process .draft{background:#fafbfc;border:1px solid var(--line);
  border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;
  margin:6px 0;font-size:14px;max-height:340px;overflow:auto}
#process .draft-head{color:var(--muted);font-size:12px;margin-bottom:6px}
#process .draft-title{font-weight:600;margin-bottom:6px}
#process .draft-sum{color:#3b4757;margin-bottom:6px}
#process .draft-sec{font-weight:600;margin:8px 0 2px}
#process .draft-p{color:#3b4757;overflow-wrap:anywhere;margin:2px 0}

.bar{flex:0 0 auto;border-top:1px solid var(--line);background:var(--card);
     padding:12px 16px}
.bar .inner{max-width:920px;margin:0 auto;display:flex;gap:8px}
textarea{flex:1;resize:none;height:46px;padding:11px 12px;border:1px solid var(--line);
         border-radius:9px;font:inherit;outline:none}
textarea:focus{border-color:var(--accent)}
button{padding:0 18px;height:46px;border:0;border-radius:9px;background:var(--accent);
       color:#fff;font:inherit;cursor:pointer;white-space:nowrap}
button.ghost{background:#eef1f5;color:#2a3442}
button.warn{background:#c0392b}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:9px;
      background:#eef1f5;color:#2a3442;text-decoration:none}
.ok{background:#e8f6ec;border:1px solid #b7e0c4;padding:10px 14px;border-radius:9px;
    margin-top:8px;overflow-wrap:anywhere}
.err{color:#c0392b}

@media(max-width:760px){
  .sidebar{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <button id="newSession" class="ghost full">＋ 新建会话</button>
    <div class="side-label">历史会话</div>
    <div class="session-list" id="sessionList"></div>
  </aside>
  <main class="content">
    <div class="scroll" id="scroll">
      <h1>网页研究与 HTML 报告</h1>
      <div class="sub">
        输入主题或链接，智能体会实时展示执行过程，每个阶段后面跟着它已用的时间（秒）。
        <b>运行中再发一条消息会自动打断当前任务</b>，带着上文改方向，不必先点停止。
      </div>

      <div id="messages"></div>

      <div class="card" id="processCard">
        <div class="hint" id="processTitle">智能体执行过程（尚无动作）</div>
        <div id="process"></div>
      </div>

      <div id="result"></div>
    </div>

    <div class="bar"><div class="inner">
      <textarea id="msg" placeholder="例如：整理 SQLite 的适用场景和限制，生成中文报告。生成后要发布就说「…然后部署到服务器」"></textarea>
      <button id="stop" class="warn" style="display:none">停止</button>
      <button id="send">发送</button>
    </div></div>
  </main>
</div>

<script>
const S = { sessionId: null, taskId: null, artifactId: null, es: null,
            running: false, status: null, stages: [], stageSeq: 0, skew: 0,
            turn: 0, streamBubble: null, sessions: [] };

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function addMessage(role, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  $('messages').appendChild(el);
  el.scrollIntoView({block: 'end', behavior: 'smooth'});
}

// ---------- 侧边栏：会话列表 ----------

function fmtTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderSessionList() {
  const box = $('sessionList');
  box.innerHTML = '';
  if (!S.sessions.length) {
    box.innerHTML = '<div class="hint" style="padding:8px 4px">还没有历史会话</div>';
    return;
  }
  for (const s of S.sessions) {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.session_id === S.sessionId ? ' active' : '');
    item.dataset.id = s.session_id;
    item.innerHTML =
      `<div class="t">${esc(s.title)}</div>` +
      `<div class="m">${esc(s.message_count)} 条消息 · ${fmtTime(s.updated_at)}</div>`;
    item.onclick = () => openSession(s.session_id);
    box.appendChild(item);
  }
}

async function loadSessions() {
  try {
    const res = await fetch('/api/sessions');
    if (!res.ok) return;
    const data = await res.json();
    S.sessions = data.sessions || [];
    renderSessionList();
  } catch { /* 拉不到列表不阻塞主流程 */ }
}

async function openSession(id) {
  if (S.running) await interrupt();
  clearAll();
  setRunning(false);
  S.sessionId = id;
  S.taskId = null;
  S.status = null;
  renderSessionList();          // 高亮当前会话
  try {
    const res = await fetch(`/api/sessions/${id}/messages`);
    if (!res.ok) return;
    const data = await res.json();
    for (const m of (data.messages || [])) {
      addMessage(m.role, m.content);
    }
  } catch { /* 读历史失败不影响 */ }
}

async function newSession() {
  if (S.running) await interrupt();
  clearAll();
  setRunning(false);
  S.sessionId = null;
  S.taskId = null;
  S.status = null;
  renderSessionList();
}

// 直接回答问题时的增量文本（打字机效果）。后端用流式返回，这里边收边追加。
function onAnswerDelta(ev) {
  if (!S.streamBubble) {
    const wrap = document.createElement('div');
    wrap.className = 'msg assistant';
    wrap.innerHTML = '<div class="bubble"></div>';
    $('messages').appendChild(wrap);
    S.streamBubble = wrap.querySelector('.bubble');
  }
  S.streamBubble.textContent += ev.text || '';
  S.streamBubble.parentElement.scrollIntoView({block: 'end', behavior: 'smooth'});
}

// 整理报告阶段是全程最长的静默期。模型流式生成工具参数，后端边收边解析出半成品报告，
// 这里就地渲染，让用户看到报告在长出来。
function renderDraft(report) {
  const parts = [];
  if (report.title) parts.push(`<div class="draft-title">${esc(report.title)}</div>`);
  if (report.summary) parts.push(`<div class="draft-sum">${esc(report.summary)}</div>`);
  for (const sec of (report.sections || [])) {
    if (sec.heading) parts.push(`<div class="draft-sec">${esc(sec.heading)}</div>`);
    for (const p of (sec.paragraphs || [])) {
      if (p.text) parts.push(`<div class="draft-p">${esc(p.text)}</div>`);
    }
  }
  return parts.join('');
}

function onDraft(ev) {
  const turn = currentTurnEl();
  let box = turn.querySelector('.draft');
  if (!ev.report) {                 // null = 清空（重试用）
    if (box) box.remove();
    return;
  }
  if (!box) {
    box = document.createElement('div');
    box.className = 'draft';
    turn.appendChild(box);
  }
  box.innerHTML = '<div class="draft-head">📝 报告草稿（生成中）</div>'
                  + renderDraft(ev.report);
  box.scrollIntoView({block: 'end', behavior: 'smooth'});
}

function sealDraft() {
  document.querySelectorAll('#process .draft-head').forEach(el => {
    el.textContent = '📝 报告内容';
  });
}

function addEvent(ev) {
  const row = document.createElement('div');
  row.className = 'row';
  if (ev.type === 'thought') {
    row.innerHTML = `<div class="ico">💭</div><div class="thought">${esc(ev.text)}</div>`;
  } else if (ev.type === 'action') {
    const detail = ev.detail ? `<span class="detail">：${esc(ev.detail)}</span>` : '';
    row.innerHTML = `<div class="ico">${esc(ev.icon || '•')}</div>` +
                    `<div>${esc(ev.label)}${detail}</div>`;
  } else { return; }
  currentTurnEl().appendChild(row);
  row.scrollIntoView({block: 'end', behavior: 'smooth'});
}

function currentTurnEl() {
  let el = $('process').lastElementChild;
  if (!el || !el.classList.contains('turn')) {
    el = document.createElement('div');
    el.className = 'turn';
    $('process').appendChild(el);
  }
  return el;
}

function startNewTurn() {
  S.turn += 1;
  S.streamBubble = null;
  $('result').innerHTML = '';
  const turn = document.createElement('div');
  turn.className = 'turn';
  const head = document.createElement('div');
  head.className = 'turn-head';
  head.textContent = `第 ${S.turn} 轮`;
  turn.appendChild(head);
  $('process').appendChild(turn);
  $('processTitle').textContent = '智能体执行过程';
}

// ---------- 阶段耗时（内联到执行过程流，进行中实时累加） ----------

function elapsedOf(st) {
  if (st.done) return st.seconds;
  return Math.max(0, (Date.now() / 1000 - S.skew) - st.at);
}

function onStageStart(ev) {
  if (ev.stage === 'instruction') return;   // 与解析需求重复，不展示
  if (!S.stages.length) S.skew = Date.now() / 1000 - ev.at;
  const st = { id: ++S.stageSeq, stage: ev.stage, label: ev.label || ev.stage,
               at: ev.at, done: false, seconds: null, status: '', turn: S.turn };
  S.stages.push(st);
  appendStageRow(st);
}

function onStageEnd(ev) {
  for (let i = S.stages.length - 1; i >= 0; i--) {
    const st = S.stages[i];
    if (st.stage === ev.stage && !st.done) {
      st.done = true;
      st.seconds = ev.seconds;
      st.status = ev.status || '完成';
      break;
    }
  }
  renderStages();
}

function appendStageRow(st) {
  const row = document.createElement('div');
  row.className = 'stage-row';
  row.dataset.id = st.id;
  row.innerHTML =
    `<div class="stage-ico">🔹</div>` +
    `<div class="stage-text">${esc(st.label)}<span class="detail"> · 进行中…</span></div>` +
    `<div class="stage-sec"><b>0.00s</b></div>`;
  currentTurnEl().appendChild(row);
  row.scrollIntoView({block: 'end', behavior: 'smooth'});
}

function renderStages() {
  for (const st of S.stages) {
    const row = document.querySelector(`#process .stage-row[data-id="${st.id}"]`);
    if (!row) continue;
    if (st.done) {
      row.querySelector('.stage-sec').innerHTML = `${st.seconds.toFixed(2)}s`;
      row.querySelector('.stage-text').innerHTML =
        `${esc(st.label)}<span class="detail"> · ${esc(st.status || '完成')}</span>`;
    }
  }
  updateTotal();
}

function updateTotal() {
  const turnTotal = S.stages
    .filter(st => st.turn === S.turn)
    .reduce((sum, st) => sum + elapsedOf(st), 0);
  const allTotal = S.stages.reduce((sum, st) => sum + elapsedOf(st), 0);
  $('processTitle').textContent = allTotal > 0
    ? `智能体执行过程 · 本轮 ${turnTotal.toFixed(2)}s（累计 ${allTotal.toFixed(2)}s）`
    : '智能体执行过程';
}

function closeOpenStages(status) {
  const label = status === 'cancelled' ? '已中断'
              : status === 'failed' ? '已失败' : '已结束';
  let changed = false;
  for (const st of S.stages) {
    if (st.done) continue;
    st.done = true;
    st.seconds = elapsedOf(st);
    st.status = label;
    changed = true;
  }
  if (changed) renderStages();
}

setInterval(() => {
  let ticking = false;
  for (const st of S.stages) {
    if (st.done) continue;
    ticking = true;
    const row = document.querySelector(`#process .stage-row[data-id="${st.id}"]`);
    if (row) row.querySelector('.stage-sec').innerHTML = `<b>${elapsedOf(st).toFixed(2)}s</b>`;
  }
  if (ticking) updateTotal();
}, 100);

function clearAll() {
  $('process').innerHTML = '';
  $('messages').innerHTML = '';
  $('result').innerHTML = '';
  $('processTitle').textContent = '智能体执行过程';
  S.stages = [];
  S.turn = 0;
  S.stageSeq = 0;
  S.skew = 0;
  S.streamBubble = null;
}

function setRunning(on) {
  S.running = on;
  $('send').disabled = false;
  $('send').textContent = on ? '打断并发送' : '发送';
  $('stop').style.display = on ? '' : 'none';
}

async function interrupt() {
  if (!S.taskId || !S.running) return;
  const stream = S.es;
  try {
    await fetch(`/api/tasks/${S.taskId}/cancel`, {method: 'POST'});
  } catch { /* 取消失败也让新一轮继续 */ }
  const deadline = Date.now() + 2000;
  while (S.running && Date.now() < deadline) {
    await new Promise(r => setTimeout(r, 50));
  }
  if (S.es === stream) { S.es.close(); S.es = null; }
  S.running = false;
}

async function send() {
  const text = $('msg').value.trim();
  if (!text) return;
  $('msg').value = '';
  if (S.running) await interrupt();
  addMessage('user', text);
  startNewTurn();
  setRunning(true);
  $('send').disabled = true;
  try {
    const res = await fetch('/api/tasks', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: text, session_id: S.sessionId}),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    S.sessionId = data.session_id;
    S.taskId = data.task_id;
    S.status = null;
    loadSessions();            // 新会话或活跃时间变了，刷新侧边栏
    openStream(S.taskId);
  } catch (err) {
    addMessage('assistant', '提交失败：' + err.message);
    setRunning(false);
  } finally {
    $('send').disabled = false;
  }
}

function openStream(taskId) {
  if (S.es) S.es.close();
  const es = new EventSource(`/api/tasks/${taskId}/events`);
  S.es = es;
  es.onmessage = e => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (ev.type === 'task') { S.artifactId = ev.artifact_id; return; }
    if (ev.type === 'draft') { onDraft(ev); return; }
    if (ev.type === 'answer_delta') { onAnswerDelta(ev); return; }
    if (ev.type === 'stage_start') { onStageStart(ev); return; }
    if (ev.type === 'stage_end') { onStageEnd(ev); return; }
    if (ev.type === 'result') { showDeployed(ev.public_url, ev.deployment_id); return; }
    if (ev.type === 'status') {
      if (ev.detail) {
        if (S.streamBubble) {
          S.streamBubble.textContent = ev.detail;
          S.streamBubble = null;
        } else {
          addMessage('assistant', ev.detail);
        }
      }
      finish(ev.status);
      return;
    }
    if (ev.type === 'end') { finish(ev.status); return; }
    addEvent(ev);
  };
  es.onerror = () => { /* 断线由浏览器自动重连 */ };
}

async function finish(status) {
  if (!S.running && S.status === status) return;
  S.status = status;
  setRunning(false);
  if (S.es) { S.es.close(); S.es = null; }
  closeOpenStages(status);
  sealDraft();
  loadSessions();            // 消息数、活跃时间变了，刷新侧边栏
  if (!S.taskId) return;
  try {
    const res = await fetch(`/api/tasks/${S.taskId}`);
    const data = await res.json();
    renderResult(data.state);
  } catch { /* 结果区拿不到不影响主流程 */ }
}

function renderResult(state) {
  if (!state) return;
  const box = $('result');
  box.innerHTML = '';
  const deployment = state.deployment || {};

  // 只有真正渲染出 HTML 的任务才有产物区（state.artifact 由 render_html 写入）。
  // 直接回答（answered）的 state 里没有 artifact，不该出现「打开 / 下载 HTML」这种 404 链接。
  if (state.artifact) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<b>报告产物</b><div class="actions"></div>';
    const actions = card.querySelector('.actions');
    if (S.taskId) {
      const a = document.createElement('a');
      a.className = 'btn';
      a.href = `/api/tasks/${S.taskId}/artifact`;
      a.target = '_blank';
      a.textContent = '打开 / 下载 HTML';
      actions.appendChild(a);
    }
    if (deployment.status !== 'success') {
      const btn = document.createElement('button');
      btn.textContent = '部署到服务器';
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '部署中…';
        try {
          const res = await fetch(`/api/tasks/${S.taskId}/deploy`, {method: 'POST'});
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
          showDeployed(data.public_url, data.deployment_id);
        } catch (err) {
          btn.disabled = false; btn.textContent = '部署到服务器';
          box.insertAdjacentHTML('beforeend',
            `<div class="card err">部署失败：${esc(err.message)}</div>`);
        }
      };
      actions.appendChild(btn);
    }
    box.appendChild(card);
  }

  if (deployment.public_url) showDeployed(deployment.public_url, deployment.deployment_id);
}

function showDeployed(url, siteId) {
  const box = $('result');
  box.insertAdjacentHTML('afterbegin',
    `<div class="card ok">已部署：<a href="${esc(url)}" target="_blank">${esc(url)}</a>` +
    (siteId ? `<div class="hint">站点 ID：${esc(siteId)}</div>` : '') + '</div>');
}

async function stop() {
  if (!S.taskId || !S.running) return;
  $('stop').disabled = true;
  try { await fetch(`/api/tasks/${S.taskId}/cancel`, {method: 'POST'}); }
  finally { $('stop').disabled = false; }
}

$('send').onclick = send;
$('stop').onclick = stop;
$('newSession').onclick = newSession;
$('msg').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
});

loadSessions();   // 页面加载时先拉会话列表
</script>
</body>
</html>
